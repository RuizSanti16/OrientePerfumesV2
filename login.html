<!DOCTYPE html>
    <html lang="es">
    <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>OrientPerfumes – Acceder</title>
    <link rel="stylesheet" href="css/login.css"/>

    <!--
    ============================================================
    FUENTES (mismas que la landing principal)
    - Cormorant Garamond : títulos grandes
    - Cinzel             : labels y botones
    - Lato               : cuerpo de texto
    ============================================================
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>

    <!--
    Hoja de estilos del login — css/login.css
    Separada del estilo de la landing para modularidad.
    -->
    </head>
    <body>

    <!-- ============================================================
        CONTENEDOR RAÍZ
        Divide la pantalla en dos mitades:
            · .panel-form  → formulario de autenticación (izquierda)
            · .panel-brand → presentación de marca (derecha)
    ============================================================ -->
    <div class="auth-wrapper">

        <!-- ══════════════════════════════════════════════════════
            PANEL IZQUIERDO — FORMULARIO
        ══════════════════════════════════════════════════════ -->
        <aside class="panel-form">

        <!-- Cabecera del panel: logo + título dinámico -->
        <div class="panel-form__header">
            <a href="index.html" class="panel-form__logo-link" title="Volver al inicio">
            <img src="assets/Logo Oriente SIN FONDO (1) (1).png" alt="" width="56" height="56" />
            </a>
            <div class="panel-form__brand-text">
            <span class="panel-form__brand-name">OrientPerfumes</span>
            <!--
                El subtítulo cambia según la vista activa:
                "Ingresa tu Usuario", "Crear Cuenta" o "Recuperar Contraseña"
                Se actualiza mediante JS en js/login.js
            -->
            <span class="panel-form__brand-sub" id="panel-subtitle">Ingresa tu Usuario</span>
            </div>
        </div>

        <!-- ── VISTA 1: INICIAR SESIÓN ─────────────────────── -->
        <!--
            Vista por defecto. El usuario ingresa su nombre/email
            y contraseña para acceder a la landing.
        -->
        <div class="auth-view active" id="view-login">

            <div class="form-group">
            <label class="form-label" for="login-user">Nombre Usuario</label>
            <input
                class="form-input"
                id="login-user"
                type="text"
                placeholder="Escribe tu nombre"
                autocomplete="username"
                aria-required="true"
            />
            <!-- Mensaje de error que aparece si el campo está vacío -->
            <span class="form-error" id="login-user-err" aria-live="polite"></span>
            </div>

            <div class="form-group">
            <label class="form-label" for="login-pass">Contraseña</label>
            <div class="input-wrap">
                <input
                class="form-input"
                id="login-pass"
                type="password"
                placeholder="Contraseña"
                autocomplete="current-password"
                aria-required="true"
                />
                <!-- Botón ojo: muestra/oculta la contraseña -->
                <button class="toggle-pass" type="button" data-target="login-pass" aria-label="Mostrar contraseña">
                <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
                </button>
            </div>
            <span class="form-error" id="login-pass-err" aria-live="polite"></span>
            </div>

            <!-- Mensaje de error global (credenciales incorrectas) -->
            <div class="form-alert form-alert--error" id="login-alert" role="alert" aria-live="assertive" hidden>
            Usuario o contraseña incorrectos.
            </div>
            <!-- Mensaje de éxito al registrarse o recuperar -->
            <div class="form-alert form-alert--success" id="login-success" role="status" aria-live="polite" hidden></div>

            <button class="btn-primary" id="btn-login" type="button">Entrar</button>

            <div class="auth-links">
            <!-- Cambia a la vista de registro -->
            <button class="btn-outline" id="go-register" type="button">Crear Usuario</button>
            <!-- Cambia a la vista de recuperar contraseña -->
            <button class="btn-outline" id="go-recover" type="button">
                Recuperar<br/>Contraseña
            </button>
            </div>

        </div><!-- /view-login -->


        <!-- ── VISTA 2: CREAR CUENTA ──────────────────────── -->
        <!--
            Formulario de registro. Pide nombre de usuario,
            email, contraseña y confirmación. Almacena en
            localStorage para simulación (sin backend).
        -->
        <div class="auth-view" id="view-register">

            <div class="form-group">
            <label class="form-label" for="reg-user">Nombre de Usuario</label>
            <input
                class="form-input"
                id="reg-user"
                type="text"
                placeholder="Elige un nombre de usuario"
                autocomplete="username"
                aria-required="true"
            />
            <span class="form-error" id="reg-user-err" aria-live="polite"></span>
            </div>

            <div class="form-group">
            <label class="form-label" for="reg-email">Correo Electrónico</label>
            <input
                class="form-input"
                id="reg-email"
                type="email"
                placeholder="tu@correo.com"
                autocomplete="email"
                aria-required="true"
            />
            <span class="form-error" id="reg-email-err" aria-live="polite"></span>
            </div>

            <div class="form-group">
            <label class="form-label" for="reg-telefono">Número de Teléfono</label>
            <input
                class="form-input"
                id="reg-telefono"
                type="tel"
                placeholder="Ej: 3001234567"
                autocomplete="tel"
            />
            <span class="form-error" id="reg-telefono-err" aria-live="polite"></span>
            </div>

            <div class="form-group">
            <label class="form-label" for="reg-pass">Contraseña</label>
            <div class="input-wrap">
                <input
                class="form-input"
                id="reg-pass"
                type="password"
                placeholder="Mínimo 6 caracteres"
                autocomplete="new-password"
                aria-required="true"
                />
                <button class="toggle-pass" type="button" data-target="reg-pass" aria-label="Mostrar contraseña">
                <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
                </button>
            </div>
            <span class="form-error" id="reg-pass-err" aria-live="polite"></span>
            </div>

            <div class="form-group">
            <label class="form-label" for="reg-pass2">Confirmar Contraseña</label>
            <div class="input-wrap">
                <input
                class="form-input"
                id="reg-pass2"
                type="password"
                placeholder="Repite tu contraseña"
                autocomplete="new-password"
                aria-required="true"
                />
                <button class="toggle-pass" type="button" data-target="reg-pass2" aria-label="Mostrar contraseña">
                <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
                </button>
            </div>
            <span class="form-error" id="reg-pass2-err" aria-live="polite"></span>
            </div>

            <div class="form-alert form-alert--error" id="reg-alert" role="alert" aria-live="assertive" hidden></div>

            <button class="btn-primary" id="btn-register" type="button">Crear Cuenta</button>

            <div class="auth-links auth-links--center">
            <button class="link-btn" id="go-login-from-reg" type="button">
                ¿Ya tienes cuenta? Inicia sesión
            </button>
            </div>

        </div><!-- /view-register -->


        <!-- ── VISTA 3: RECUPERAR CONTRASEÑA ─────────────── -->
        <!--
            El usuario ingresa su email. Se simula el envío
            de un correo de recuperación (sin backend real).
        -->
        <div class="auth-view" id="view-recover">

            <p class="view-description">
            Ingresa tu correo electrónico y te enviaremos las instrucciones para restablecer tu contraseña.
            </p>

            <div class="form-group">
            <label class="form-label" for="rec-email">Correo Electrónico</label>
            <input
                class="form-input"
                id="rec-email"
                type="email"
                placeholder="tu@correo.com"
                autocomplete="email"
                aria-required="true"
            />
            <span class="form-error" id="rec-email-err" aria-live="polite"></span>
            </div>

            <div class="form-alert form-alert--success" id="rec-success" role="status" aria-live="polite" hidden></div>
            <div class="form-alert form-alert--error"   id="rec-alert"   role="alert"  aria-live="assertive" hidden></div>

            <button class="btn-primary" id="btn-recover" type="button">Enviar Instrucciones</button>

            <div class="auth-links auth-links--center">
            <button class="link-btn" id="go-login-from-rec" type="button">
                ← Volver al inicio de sesión
            </button>
            </div>

        </div><!-- /view-recover -->

        </aside><!-- /panel-form -->


        <!-- ══════════════════════════════════════════════════════
            PANEL DERECHO — PRESENTACIÓN DE MARCA
            Texto animado + líneas decorativas doradas.
            Solo visible en pantallas >= 768px.
        ══════════════════════════════════════════════════════ -->
        <section class="panel-brand" aria-hidden="true">

        <!-- Líneas diagonales decorativas (efecto geométrico) -->
        <div class="brand-deco brand-deco--top-right"></div>
        <div class="brand-deco brand-deco--bottom-left"></div>

        <div class="panel-brand__content">
            <h1 class="brand-welcome">
            <span class="brand-welcome__line1">Bienvenido a la</span>
            <span class="brand-welcome__line2">Familia de</span>
            <span class="brand-welcome__line3">OrientPerfumes</span>
            </h1>
            <p class="brand-tagline">
            Perfumería 100% Original
            <span class="brand-tagline__cursor" aria-hidden="true">|</span>
            </p>
        </div>

        </section><!-- /panel-brand -->

    </div><!-- /auth-wrapper -->

    <!--
    Script de autenticación — js/login.js
    Se carga al final del body para no bloquear el renderizado.
    -->
<script src="js/login.js"></script>

</body>
</html>
