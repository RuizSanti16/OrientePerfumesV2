<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categorías — OrientPerfumes Admin</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="admin-layout">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="admin-main">
    <header class="admin-header">
      <button class="sidebar-toggle" id="sidebarToggle">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" width="20" height="20"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="admin-header__right">
        <div class="admin-user-info">
          <span class="admin-user-info__name" id="adminUserName">Admin</span>
          <span class="admin-user-info__role" id="adminUserRole">(admin)</span>
        </div>
        <button class="btn-logout" onclick="adminLogout()">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          Salir
        </button>
      </div>
    </header>

    <main class="admin-content">
      <div class="page-header">
        <h1 class="page-title">Categorías</h1>
        <p class="page-subtitle">Gestiona las categorías del catálogo</p>
      </div>

      <div class="page-toolbar">
        <div class="search-box">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><path stroke-linecap="round" d="m21 21-4.35-4.35"/></svg>
          <input type="text" id="searchInput" placeholder="Buscar categorías...">
        </div>
        <button class="btn btn-gold" onclick="openCatModal()">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
          Nueva Categoría
        </button>
      </div>

      <div class="admin-card">
        <div class="admin-card__body table-wrapper">
          <table class="admin-table">
            <thead><tr><th>Nombre</th><th>Descripción</th><th>Acciones</th></tr></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-header">
      <h3 class="modal-title" id="modalTitle">Nueva Categoría</h3>
      <button class="modal-close" id="modalCloseBtn">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-gold" id="modalSaveBtn">Guardar</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="js/admin-data.js"></script>
<script src="js/admin-core.js"></script>
<script>
  var editingId = null;

  document.addEventListener('DOMContentLoaded', function () {
    initAdminLayout();
    renderTable();
    document.getElementById('searchInput').addEventListener('input', function () { renderTable(this.value); });
  });

  function renderTable(search) {
    search = (search || '').toLowerCase();
    var items = AdminDB.get('categories').filter(function (c) {
      return !search || c.name.toLowerCase().includes(search);
    });
    var tbody = document.getElementById('tableBody');
    if (items.length === 0) {
      tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;padding:28px;color:var(--cream-muted)">No se encontraron categorías</td></tr>';
      return;
    }
    tbody.innerHTML = items.map(function (c) {
      return '<tr>' +
        '<td><strong style="color:var(--cream);">' + c.name + '</strong></td>' +
        '<td>' + (c.description || '—') + '</td>' +
        '<td><div class="action-btns">' +
          '<button class="btn btn-outline btn-sm" onclick="openCatModal(\'' + c.id + '\')">' +
            '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="12" height="12"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>' +
          '</button>' +
          '<button class="btn btn-danger btn-sm" onclick="deleteCat(\'' + c.id + '\')">' +
            '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="12" height="12"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>' +
          '</button>' +
        '</div></td></tr>';
    }).join('');
  }

  function openCatModal(id) {
    editingId = id || null;
    var cat = id ? AdminDB.getOne('categories', id) : null;
    var body =
      '<div class="form-group"><label class="form-label">Nombre *</label>' +
        '<input class="form-input" id="fName" value="' + (cat ? cat.name : '') + '" placeholder="Nombre de la categoría"></div>' +
      '<div class="form-group"><label class="form-label">Descripción</label>' +
        '<textarea class="form-textarea" id="fDesc" placeholder="Descripción breve">' + (cat ? cat.description : '') + '</textarea></div>';
    openModal(id ? 'Editar Categoría' : 'Nueva Categoría', body, saveCat);
  }

  function saveCat() {
    var name = document.getElementById('fName').value.trim();
    if (!name) { showToast('El nombre es requerido', 'error'); return; }
    var data = { name: name, description: document.getElementById('fDesc').value.trim() };
    if (editingId) { AdminDB.update('categories', editingId, data); showToast('Categoría actualizada', 'success'); }
    else { AdminDB.create('categories', data); showToast('Categoría creada', 'success'); }
    closeModal(); renderTable();
  }

  function deleteCat(id) {
    confirmAction('¿Eliminar esta categoría?', function () {
      AdminDB.delete('categories', id);
      showToast('Categoría eliminada', 'info');
      renderTable();
    });
  }
</script>
</body>
</html>
