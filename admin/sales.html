<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ventas — OrientPerfumes Admin</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="admin-layout">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="admin-main">
    <header class="admin-header">
      <button class="sidebar-toggle" id="sidebarToggle">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" width="20" height="20"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="admin-header__right">
        <div class="admin-user-info">
          <span class="admin-user-info__name" id="adminUserName">Admin</span>
          <span class="admin-user-info__role" id="adminUserRole">(admin)</span>
        </div>
        <button class="btn-logout" onclick="adminLogout()">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          Salir
        </button>
      </div>
    </header>

    <main class="admin-content">
      <div class="page-header">
        <h1 class="page-title">Ventas</h1>
        <p class="page-subtitle">Historial de ventas realizadas</p>
      </div>

      <div class="kpi-grid" id="kpiGrid" style="margin-bottom:24px;"></div>

      <div class="page-toolbar">
        <div class="search-box">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><path stroke-linecap="round" d="m21 21-4.35-4.35"/></svg>
          <input type="text" id="searchInput" placeholder="Buscar por cliente...">
        </div>
        <button class="btn btn-gold" onclick="openSaleModal()">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
          Registrar Venta
        </button>
      </div>

      <div class="admin-card">
        <div class="admin-card__body table-wrapper">
          <table class="admin-table">
            <thead><tr><th>#</th><th>Fecha</th><th>Cliente</th><th>Productos</th><th>Total</th><th>Estado</th></tr></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-header">
      <h3 class="modal-title" id="modalTitle">Registrar Venta</h3>
      <button class="modal-close" id="modalCloseBtn">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-gold" id="modalSaveBtn">Guardar</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="js/admin-data.js"></script>
<script src="js/admin-core.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    initAdminLayout();
    renderKPIs();
    renderTable();
    document.getElementById('searchInput').addEventListener('input', function () { renderTable(this.value); });
  });

  function renderKPIs() {
    var sales = AdminDB.get('sales');
    var total = sales.reduce(function (s, v) { return s + v.total; }, 0);
    var today = new Date().toISOString().split('T')[0];
    var todayTotal = sales.filter(function (s) { return s.date === today; }).reduce(function (s, v) { return s + v.total; }, 0);
    var grid = document.getElementById('kpiGrid');
    grid.innerHTML =
      '<div class="kpi-card"><div class="kpi-card__icon"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div><div><div class="kpi-card__label">Total Ventas</div><div class="kpi-card__value">$' + total.toLocaleString('es-CO') + '</div></div></div>' +
      '<div class="kpi-card"><div class="kpi-card__icon"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg></div><div><div class="kpi-card__label">Ventas Hoy</div><div class="kpi-card__value">$' + todayTotal + '</div></div></div>' +
      '<div class="kpi-card"><div class="kpi-card__icon"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg></div><div><div class="kpi-card__label">Nº de Ventas</div><div class="kpi-card__value">' + sales.length + '</div></div></div>';
  }

  function renderTable(search) {
    search = (search || '').toLowerCase();
    var items = AdminDB.get('sales').filter(function (s) {
      return !search || (s.customerName || '').toLowerCase().includes(search);
    }).sort(function (a, b) { return b.date > a.date ? 1 : -1; });
    var tbody = document.getElementById('tableBody');
    if (items.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:28px;color:var(--cream-muted)">No hay ventas registradas</td></tr>';
      return;
    }
    tbody.innerHTML = items.map(function (s, i) {
      var productList = (s.items || []).map(function (it) { return it.productName + ' x' + it.qty; }).join(', ') || '—';
      return '<tr>' +
        '<td class="mono">' + s.id + '</td>' +
        '<td>' + s.date + '</td>' +
        '<td><strong style="color:var(--cream);">' + (s.customerName || '—') + '</strong></td>' +
        '<td style="font-size:12px;">' + productList + '</td>' +
        '<td class="bold">$' + s.total + '</td>' +
        '<td><span class="badge badge-green">Completada</span></td></tr>';
    }).join('');
  }

  function openSaleModal() {
    var customers = AdminDB.get('customers');
    var products  = AdminDB.get('products');
    var custOpts  = customers.map(function (c) { return '<option value="' + c.id + '">' + c.name + '</option>'; }).join('');
    var prodOpts  = products.map(function (p) { return '<option value="' + p.id + '" data-price="' + p.price + '">' + p.name + ' ($' + p.price + ')</option>'; }).join('');
    var body =
      '<div class="form-group"><label class="form-label">Cliente *</label>' +
        '<select class="form-select" id="fCustomer"><option value="">Seleccionar</option>' + custOpts + '</select></div>' +
      '<div class="form-group"><label class="form-label">Fecha</label>' +
        '<input class="form-input" id="fDate" type="date" value="' + new Date().toISOString().split('T')[0] + '"></div>' +
      '<div class="form-group"><label class="form-label">Producto *</label>' +
        '<select class="form-select" id="fProduct"><option value="">Seleccionar</option>' + prodOpts + '</select></div>' +
      '<div class="form-grid-2">' +
        '<div class="form-group"><label class="form-label">Cantidad</label><input class="form-input" id="fQty" type="number" min="1" value="1"></div>' +
        '<div class="form-group"><label class="form-label">Total ($)</label><input class="form-input" id="fTotal" type="number" min="0" value="0"></div>' +
      '</div>';
    openModal('Registrar Venta', body, saveSale);

    // Auto-fill total
    setTimeout(function () {
      var prodSel  = document.getElementById('fProduct');
      var qtySel   = document.getElementById('fQty');
      var totalSel = document.getElementById('fTotal');
      function updateTotal() {
        var opt = prodSel.options[prodSel.selectedIndex];
        var price = opt ? parseFloat(opt.dataset.price) || 0 : 0;
        var qty   = parseInt(qtySel.value) || 1;
        totalSel.value = (price * qty).toLocaleString('es-CO');
      }
      prodSel && prodSel.addEventListener('change', updateTotal);
      qtySel  && qtySel.addEventListener('input', updateTotal);
    }, 100);
  }

  function saveSale() {
    var custId  = document.getElementById('fCustomer').value;
    var prodSel = document.getElementById('fProduct');
    var total   = parseFloat(document.getElementById('fTotal').value) || 0;
    if (!custId || !prodSel.value) { showToast('Selecciona cliente y producto', 'error'); return; }
    var customers = AdminDB.get('customers');
    var cust = customers.find(function (c) { return c.id === custId; });
    var prodId = prodSel.value;
    var prodName = prodSel.options[prodSel.selectedIndex].text.split(' (')[0];
    var qty = parseInt(document.getElementById('fQty').value) || 1;
    var data = {
      date: document.getElementById('fDate').value,
      customerId: custId,
      customerName: cust ? cust.name : '',
      items: [{ productId: prodId, productName: prodName, qty: qty, price: total / qty }],
      total: total,
      status: 'completed',
    };
    AdminDB.create('sales', data);
    showToast('Venta registrada', 'success');
    closeModal();
    renderKPIs();
    renderTable();
  }
</script>
</body>
</html>
