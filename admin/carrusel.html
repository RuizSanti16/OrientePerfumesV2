<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrusel — OrientPerfumes Admin</title>
  <link rel="stylesheet" href="css/admin.css">
  <style>
    /* ── Estilos específicos de esta página ──────────────── */

    .slide-card {
      background: var(--dark-surface);
      border: 1px solid rgba(201,168,76,0.15);
      border-radius: 8px;
      margin-bottom: 24px;
      overflow: hidden;
    }
    .slide-card__header {
      padding: 14px 20px;
      background: var(--dark-mid);
      border-bottom: 1px solid rgba(201,168,76,0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .slide-card__num {
      font-family: var(--font-label);
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--gold);
      text-transform: uppercase;
    }
    .slide-card__body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ── Previsualización ── */
    .slide-preview {
      width: 100%;
      aspect-ratio: 16 / 6;
      border-radius: 4px;
      border: 1px solid rgba(201,168,76,0.15);
      background-size: cover;
      background-position: center;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s ease;
    }
    .slide-preview::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to right,
        rgba(10,10,8,0.65) 0%,
        rgba(10,10,8,0.25) 50%,
        rgba(10,10,8,0.05) 100%
      );
      pointer-events: none;
    }
    .slide-preview__empty {
      font-family: var(--font-label);
      font-size: 10px;
      letter-spacing: 0.15em;
      color: rgba(201,168,76,0.35);
      text-transform: uppercase;
      z-index: 1;
    }
    .slide-preview__tag {
      position: absolute;
      bottom: 10px; right: 12px;
      z-index: 2;
      font-size: 10px;
      color: rgba(255,255,255,0.45);
      font-family: var(--font-label);
      letter-spacing: 0.08em;
    }

    /* ── Fila imagen: upload + URL ── */
    .img-row {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px;
      align-items: end;
    }
    .btn-upload {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 16px;
      border: 1px dashed rgba(201,168,76,0.4);
      border-radius: 4px;
      background: rgba(201,168,76,0.04);
      color: var(--gold);
      font-family: var(--font-label);
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.25s, border-color 0.25s;
      white-space: nowrap;
      height: 44px;
    }
    .btn-upload:hover {
      background: rgba(201,168,76,0.09);
      border-color: var(--gold);
    }
    .file-input-hidden { display: none; }

    /* ── Controles de ajuste de imagen ── */
    .img-controls {
      background: var(--dark-mid);
      border: 1px solid rgba(201,168,76,0.12);
      border-radius: 4px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .img-controls__title {
      font-family: var(--font-label);
      font-size: 9px;
      letter-spacing: 0.18em;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .controls-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .control-group label {
      font-family: var(--font-label);
      font-size: 9px;
      letter-spacing: 0.12em;
      color: var(--cream-muted);
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
    }
    .control-group label span {
      color: var(--gold);
      font-family: var(--font-body);
    }
    /* Slider personalizado */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 3px;
      background: rgba(201,168,76,0.2);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--gold);
      cursor: pointer;
      border: 2px solid var(--dark);
      box-shadow: 0 0 4px rgba(201,168,76,0.4);
    }
    input[type="range"]::-moz-range-thumb {
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--gold);
      cursor: pointer;
      border: 2px solid var(--dark);
    }

    /* Botones de posición rápida */
    .pos-btns {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
    }
    .pos-btn {
      padding: 5px;
      border: 1px solid rgba(201,168,76,0.2);
      border-radius: 3px;
      background: none;
      color: var(--cream-muted);
      font-size: 9px;
      font-family: var(--font-label);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .pos-btn:hover, .pos-btn.active {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(201,168,76,0.06);
    }

    /* Badge imagen cargada */
    .img-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      background: rgba(82,168,117,0.12);
      border: 1px solid rgba(82,168,117,0.3);
      border-radius: 20px;
      font-size: 10px;
      color: var(--success);
      margin-top: 6px;
    }

    /* Grid de textos */
    .texts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 700px) {
      .texts-grid, .controls-row, .img-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="admin-layout">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="admin-main">
    <header class="admin-header">
      <button class="sidebar-toggle" id="sidebarToggle">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="1.8" width="20" height="20">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
      <div class="admin-header__right">
        <div class="admin-user-info">
          <span class="admin-user-info__name" id="adminUserName">Admin</span>
          <span class="admin-user-info__role" id="adminUserRole">(admin)</span>
        </div>
        <button class="btn-logout" onclick="adminLogout()">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
               stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
          Salir
        </button>
      </div>
    </header>

    <main class="admin-content">

      <div class="page-header">
        <h1 class="page-title">Carrusel Hero</h1>
        <p class="page-subtitle">
          Gestiona imágenes, textos y ajuste de cada slide del inicio.
        </p>
      </div>

      <!-- Alerta imagen muy grande -->
      <div class="alert alert-warning" id="sizeAlert" style="display:none;">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
        <span id="sizeAlertText"></span>
      </div>

      <div id="slidesContainer"></div>

      <!-- Acciones globales -->
      <div style="display:flex;gap:12px;margin-top:8px;flex-wrap:wrap;">
        <button class="btn btn-gold" onclick="guardarCarrusel()">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
               stroke="currentColor" stroke-width="2" width="14" height="14">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
          </svg>
          Guardar todos los cambios
        </button>
        <button class="btn btn-ghost" onclick="restaurarDefecto()">
          Restaurar valores por defecto
        </button>
        <a href="../index.html" target="_blank"
           class="btn btn-outline btn-sm"
           style="display:inline-flex;align-items:center;gap:6px;padding:10px 16px;">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
               stroke="currentColor" stroke-width="2" width="12" height="12">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
          </svg>
          Ver página
        </a>
      </div>

    </main>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="js/admin-data.js"></script>
<script src="js/admin-core.js"></script>
<script>

/* ============================================================
   DATOS POR DEFECTO
============================================================ */
var DEFAULT_SLIDES = [
  {
    id: 1,
    label:    'Perfumería Nicho',
    titulo:   'Tesoros\nOlfativos',
    subtitulo:'Las más exclusivas casas de nicho en un solo lugar',
    btn1: 'Descubrir Nicho', btn2: 'Ver Catálogo',
    imagen: '', imgSize: 'cover', imgPosX: 50, imgPosY: 50,
    gradient: 'radial-gradient(ellipse at 70% 50%, rgba(139,105,20,0.25) 0%, transparent 60%), radial-gradient(ellipse at 80% 80%, rgba(80,55,10,0.3) 0%, transparent 50%), linear-gradient(135deg, #1a1208 0%, #0a0a08 50%, #12100a 100%)'
  },
  {
    id: 2,
    label:    'Colección Oriental',
    titulo:   'Aromas\ndel Oriente',
    subtitulo:'Oud, Ambar, Sándalo y Musk en su máxima expresión',
    btn1: 'Explorar Colección', btn2: 'Ver Novedades',
    imagen: '', imgSize: 'cover', imgPosX: 50, imgPosY: 50,
    gradient: 'radial-gradient(ellipse at 65% 40%, rgba(120,80,15,0.3) 0%, transparent 55%), radial-gradient(ellipse at 90% 70%, rgba(60,40,8,0.35) 0%, transparent 50%), linear-gradient(150deg, #100d06 0%, #0a0a08 55%, #15120a 100%)'
  },
  {
    id: 3,
    label:    'Alta Perfumería',
    titulo:   'Firmas\nde Autor',
    subtitulo:'Chanel, Dior, Tom Ford, Creed y las grandes maisons',
    btn1: 'Ver Diseñadores', btn2: 'Nuestras Marcas',
    imagen: '', imgSize: 'cover', imgPosX: 50, imgPosY: 50,
    gradient: 'radial-gradient(ellipse at 60% 50%, rgba(100,70,10,0.28) 0%, transparent 60%), radial-gradient(ellipse at 85% 60%, rgba(70,45,5,0.3) 0%, transparent 50%), linear-gradient(120deg, #0e0b05 0%, #0a0a08 50%, #131009 100%)'
  }
];

document.addEventListener('DOMContentLoaded', function () {
  initAdminLayout();
  renderSlides();
});

function getSlides() {
  try {
    var raw = localStorage.getItem('op_carrusel');
    return raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(DEFAULT_SLIDES));
  } catch (e) {
    return JSON.parse(JSON.stringify(DEFAULT_SLIDES));
  }
}

/* ============================================================
   RENDERIZAR SLIDES
============================================================ */
function renderSlides() {
  var slides = getSlides();
  var container = document.getElementById('slidesContainer');
  container.innerHTML = '';

  slides.forEach(function (slide) {
    var card = document.createElement('div');
    card.className = 'slide-card';

    var tieneImagen = slide.imagen && slide.imagen.length > 0;
    var imgSrc = tieneImagen ? (slide.imagen.startsWith('data:') ? slide.imagen : esc(slide.imagen)) : '';
    var posX   = slide.imgPosX !== undefined ? slide.imgPosX : 50;
    var posY   = slide.imgPosY !== undefined ? slide.imgPosY : 50;
    var size   = slide.imgSize || 'cover';

    var bgStyle = tieneImagen
      ? 'background-image:url(' + imgSrc + ');background-size:' + size + ';background-position:' + posX + '% ' + posY + '%;'
      : 'background:' + slide.gradient + ';';

    var badgeHTML = tieneImagen
      ? '<div class="img-badge">' +
          '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="12" height="12"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>' +
          (slide.imagen.startsWith('data:') ? 'Imagen desde archivo' : 'Imagen desde URL') +
        '</div>'
      : '';

    /* Botones de posición rápida */
    var positions = [
      {label:'↖ Arriba Izq', x:0,  y:0},
      {label:'↑ Arriba',     x:50, y:0},
      {label:'↗ Arriba Der', x:100,y:0},
      {label:'← Izquierda',  x:0,  y:50},
      {label:'⊙ Centro',     x:50, y:50},
      {label:'→ Derecha',    x:100,y:50},
      {label:'↙ Abajo Izq',  x:0,  y:100},
      {label:'↓ Abajo',      x:50, y:100},
      {label:'↘ Abajo Der',  x:100,y:100},
    ];

    var posBtnsHTML = positions.map(function (p) {
      var isActive = (p.x === posX && p.y === posY) ? ' active' : '';
      return '<button class="pos-btn' + isActive + '"' +
        ' onclick="setPosRapida(' + slide.id + ',' + p.x + ',' + p.y + ')">' +
        p.label + '</button>';
    }).join('');

    card.innerHTML =
      '<div class="slide-card__header">' +
        '<span class="slide-card__num">Slide ' + slide.id + ' · ' + esc(slide.label) + '</span>' +
      '</div>' +
      '<div class="slide-card__body">' +

        /* Previsualización */
        '<div class="slide-preview" id="preview-' + slide.id + '" style="' + bgStyle + '">' +
          (tieneImagen ? '' : '<span class="slide-preview__empty">Sin imagen · gradiente original</span>') +
          '<span class="slide-preview__tag">Slide ' + slide.id + '</span>' +
        '</div>' +

        /* Subir imagen o URL */
        '<div class="form-group">' +
          '<label class="form-label">Imagen de Fondo</label>' +
          '<div class="img-row">' +
            '<label class="btn-upload" title="Seleccionar desde tu PC">' +
              '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="18" height="18">' +
                '<path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>' +
              '</svg>' +
              'Subir archivo' +
              '<input type="file" class="file-input-hidden" id="file-' + slide.id + '"' +
                ' accept="image/jpeg,image/png,image/webp"' +
                ' onchange="subirImagen(' + slide.id + ', this)">' +
            '</label>' +
            '<input class="form-input" id="img-' + slide.id + '"' +
              ' value="' + (tieneImagen && !slide.imagen.startsWith('data:') ? esc(slide.imagen) : '') + '"' +
              ' placeholder="O pega una URL: https://ejemplo.com/imagen.jpg"' +
              ' oninput="aplicarUrlPreview(' + slide.id + ')">' +
          '</div>' +
          badgeHTML +
        '</div>' +

        /* ── CONTROLES DE AJUSTE DE IMAGEN ── */
        (tieneImagen ? (
          '<div class="img-controls">' +
            '<div class="img-controls__title">Ajuste de imagen</div>' +
            '<div class="controls-row">' +

              /* Tamaño */
              '<div class="control-group">' +
                '<label>Tamaño <span id="sizeVal-' + slide.id + '">' + (size === 'cover' ? 'Cubrir' : size === 'contain' ? 'Contener' : size) + '</span></label>' +
                '<select class="form-select" id="imgSize-' + slide.id + '"' +
                  ' onchange="actualizarAjuste(' + slide.id + ')">' +
                  '<option value="cover"' +   (size==='cover'?   ' selected':'') + '>Cubrir (recomendado)</option>' +
                  '<option value="contain"' + (size==='contain'?' selected':'') + '>Contener (completa)</option>' +
                  '<option value="auto"' +    (size==='auto'?   ' selected':'') + '>Tamaño original</option>' +
                '</select>' +
              '</div>' +

              /* Posición X */
              '<div class="control-group">' +
                '<label>Posición horizontal <span id="posXVal-' + slide.id + '">' + posX + '%</span></label>' +
                '<input type="range" id="posX-' + slide.id + '" min="0" max="100" value="' + posX + '"' +
                  ' oninput="actualizarAjuste(' + slide.id + ')">' +
              '</div>' +

              /* Posición Y */
              '<div class="control-group">' +
                '<label>Posición vertical <span id="posYVal-' + slide.id + '">' + posY + '%</span></label>' +
                '<input type="range" id="posY-' + slide.id + '" min="0" max="100" value="' + posY + '"' +
                  ' oninput="actualizarAjuste(' + slide.id + ')">' +
              '</div>' +

            '</div>' +

            /* Posición rápida */
            '<div class="control-group">' +
              '<label>Posición rápida</label>' +
              '<div class="pos-btns" id="posBtns-' + slide.id + '">' +
                posBtnsHTML +
              '</div>' +
            '</div>' +

          '</div>' /* /img-controls */
        ) : '') +

        /* Textos */
        '<div class="texts-grid">' +
          '<div class="form-group">' +
            '<label class="form-label">Etiqueta</label>' +
            '<input class="form-input" id="label-' + slide.id + '" value="' + esc(slide.label) + '" maxlength="40">' +
          '</div>' +
          '<div class="form-group">' +
            '<label class="form-label">Título <span style="color:var(--cream-muted);font-family:var(--font-body);text-transform:none;letter-spacing:0;">(\\n = salto de línea)</span></label>' +
            '<input class="form-input" id="titulo-' + slide.id + '" value="' + esc(slide.titulo) + '" maxlength="60">' +
          '</div>' +
          '<div class="form-group" style="grid-column:1/-1;">' +
            '<label class="form-label">Subtítulo</label>' +
            '<input class="form-input" id="subtitulo-' + slide.id + '" value="' + esc(slide.subtitulo) + '" maxlength="120">' +
          '</div>' +
          '<div class="form-group">' +
            '<label class="form-label">Botón 1</label>' +
            '<input class="form-input" id="btn1-' + slide.id + '" value="' + esc(slide.btn1) + '" maxlength="30">' +
          '</div>' +
          '<div class="form-group">' +
            '<label class="form-label">Botón 2</label>' +
            '<input class="form-input" id="btn2-' + slide.id + '" value="' + esc(slide.btn2) + '" maxlength="30">' +
          '</div>' +
        '</div>' +

        /* Quitar imagen */
        (tieneImagen ?
          '<button class="btn btn-danger btn-sm" onclick="quitarImagen(' + slide.id + ')">' +
            '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="12" height="12"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>' +
            'Quitar imagen (volver al gradiente)' +
          '</button>'
        : '') +

      '</div>'; /* /slide-card__body */

    container.appendChild(card);
  });
}

/* ============================================================
   AJUSTE EN TIEMPO REAL (sliders y select)
============================================================ */
function actualizarAjuste(id) {
  var preview = document.getElementById('preview-' + id);
  if (!preview) return;

  var sizeEl = document.getElementById('imgSize-' + id);
  var posXEl = document.getElementById('posX-' + id);
  var posYEl = document.getElementById('posY-' + id);

  if (!sizeEl || !posXEl || !posYEl) return;

  var size = sizeEl.value;
  var posX = posXEl.value;
  var posY = posYEl.value;

  /* Actualizar etiquetas numéricas */
  var sizeLabels = {cover:'Cubrir', contain:'Contener', auto:'Original'};
  var sizeValEl = document.getElementById('sizeVal-' + id);
  if (sizeValEl) sizeValEl.textContent = sizeLabels[size] || size;
  var posXValEl = document.getElementById('posXVal-' + id);
  if (posXValEl) posXValEl.textContent = posX + '%';
  var posYValEl = document.getElementById('posYVal-' + id);
  if (posYValEl) posYValEl.textContent = posY + '%';

  /* Aplicar a la preview */
  preview.style.backgroundSize     = size;
  preview.style.backgroundPosition = posX + '% ' + posY + '%';

  /* Actualizar botones de posición rápida */
  var btns = document.querySelectorAll('#posBtns-' + id + ' .pos-btn');
  btns.forEach(function (btn) {
    btn.classList.remove('active');
  });
}

/* ── Posición rápida con los botones de cuadrícula 3×3 ── */
function setPosRapida(id, x, y) {
  var posXEl = document.getElementById('posX-' + id);
  var posYEl = document.getElementById('posY-' + id);
  if (posXEl) posXEl.value = x;
  if (posYEl) posYEl.value = y;
  actualizarAjuste(id);

  /* Marcar botón activo */
  var btns = document.querySelectorAll('#posBtns-' + id + ' .pos-btn');
  btns.forEach(function (btn) {
    var lbl = btn.textContent.trim();
    var positions = {
      '↖ Arriba Izq':{x:0,y:0},'↑ Arriba':{x:50,y:0},'↗ Arriba Der':{x:100,y:0},
      '← Izquierda':{x:0,y:50},'⊙ Centro':{x:50,y:50},'→ Derecha':{x:100,y:50},
      '↙ Abajo Izq':{x:0,y:100},'↓ Abajo':{x:50,y:100},'↘ Abajo Der':{x:100,y:100}
    };
    var p = positions[lbl];
    btn.classList.toggle('active', p && p.x === x && p.y === y);
  });
}

/* ============================================================
   SUBIR IMAGEN DESDE ARCHIVO
============================================================ */
function subirImagen(id, input) {
  var file = input.files[0];
  if (!file) return;

  var MB = file.size / 1024 / 1024;
  if (MB > 2) {
    var alertEl = document.getElementById('sizeAlert');
    document.getElementById('sizeAlertText').textContent =
      'La imagen del slide ' + id + ' pesa ' + MB.toFixed(1) + ' MB. ' +
      'Recomendamos máximo 500 KB. Puedes comprimirla gratis en squoosh.app';
    alertEl.style.display = 'flex';
  }

  var reader = new FileReader();
  reader.onload = function (e) {
    var base64 = e.target.result;
    var preview = document.getElementById('preview-' + id);
    preview.style.backgroundImage   = 'url(' + base64 + ')';
    preview.style.backgroundSize    = 'cover';
    preview.style.backgroundPosition = '50% 50%';
    preview.innerHTML = '<span class="slide-preview__tag">Slide ' + id + '</span>';
    preview.dataset.base64 = base64;

    var urlInput = document.getElementById('img-' + id);
    if (urlInput) urlInput.value = '';

    showToast('Imagen cargada · guarda los cambios para aplicarla', 'info');

    /* Re-renderizar para mostrar los controles de ajuste */
    var slides = getSlides();
    var idx = slides.findIndex(function(s){ return s.id === id; });
    if (idx !== -1) {
      slides[idx].imagen = base64;
      localStorage.setItem('op_carrusel', JSON.stringify(slides));
      renderSlides();
    }
  };
  reader.readAsDataURL(file);
}

/* ── Aplicar URL externa ── */
function aplicarUrlPreview(id) {
  var url = document.getElementById('img-' + id).value.trim();
  var preview = document.getElementById('preview-' + id);
  var slide = getSlides().find(function (s) { return s.id === id; });
  delete preview.dataset.base64;

  if (url) {
    preview.style.backgroundImage   = 'url(' + url + ')';
    preview.style.backgroundSize    = 'cover';
    preview.style.backgroundPosition = '50% 50%';
    preview.innerHTML = '<span class="slide-preview__tag">Slide ' + id + '</span>';

    /* Guardar y re-renderizar para mostrar controles */
    var slides = getSlides();
    var idx = slides.findIndex(function(s){ return s.id === id; });
    if (idx !== -1) {
      slides[idx].imagen = url;
      localStorage.setItem('op_carrusel', JSON.stringify(slides));
      renderSlides();
    }
  } else {
    preview.style.backgroundImage = '';
    preview.style.background = slide ? slide.gradient : '';
    preview.innerHTML =
      '<span class="slide-preview__empty">Sin imagen · gradiente original</span>' +
      '<span class="slide-preview__tag">Slide ' + id + '</span>';
  }
}

/* ── Quitar imagen ── */
function quitarImagen(id) {
  confirmAction('¿Quitar la imagen del slide ' + id + '?', function () {
    var slides = getSlides();
    var idx = slides.findIndex(function (s) { return s.id === id; });
    if (idx !== -1) {
      slides[idx].imagen = '';
      slides[idx].imgSize = 'cover';
      slides[idx].imgPosX = 50;
      slides[idx].imgPosY = 50;
      localStorage.setItem('op_carrusel', JSON.stringify(slides));
    }
    renderSlides();
    showToast('Imagen quitada', 'info');
  });
}

/* ============================================================
   GUARDAR TODO
============================================================ */
function guardarCarrusel() {
  var slides = getSlides();

  var resultado = slides.map(function (slide) {
    var preview  = document.getElementById('preview-' + slide.id);
    var urlInput = document.getElementById('img-' + slide.id);
    var sizeEl   = document.getElementById('imgSize-' + slide.id);
    var posXEl   = document.getElementById('posX-' + slide.id);
    var posYEl   = document.getElementById('posY-' + slide.id);

    var imagen = '';
    if (preview && preview.dataset.base64) {
      imagen = preview.dataset.base64;
    } else if (urlInput && urlInput.value.trim()) {
      imagen = urlInput.value.trim();
    } else {
      imagen = slide.imagen || '';
    }

    return {
      id:        slide.id,
      label:     getVal('label-' + slide.id,    slide.label),
      titulo:    getVal('titulo-' + slide.id,   slide.titulo),
      subtitulo: getVal('subtitulo-' + slide.id, slide.subtitulo),
      btn1:      getVal('btn1-' + slide.id,     slide.btn1),
      btn2:      getVal('btn2-' + slide.id,     slide.btn2),
      imagen:    imagen,
      imgSize:   sizeEl ? sizeEl.value : (slide.imgSize || 'cover'),
      imgPosX:   posXEl ? parseInt(posXEl.value) : (slide.imgPosX !== undefined ? slide.imgPosX : 50),
      imgPosY:   posYEl ? parseInt(posYEl.value) : (slide.imgPosY !== undefined ? slide.imgPosY : 50),
      gradient:  slide.gradient,
    };
  });

  try {
    localStorage.setItem('op_carrusel', JSON.stringify(resultado));
    showToast('¡Guardado! Recarga el inicio para verlo.', 'success');
    renderSlides();
  } catch (e) {
    showToast('Error: almacenamiento lleno. Usa imágenes más pequeñas o por URL.', 'error');
  }
}

function restaurarDefecto() {
  confirmAction('¿Restaurar el carrusel a los valores originales?', function () {
    localStorage.removeItem('op_carrusel');
    document.getElementById('sizeAlert').style.display = 'none';
    renderSlides();
    showToast('Carrusel restaurado', 'info');
  });
}

/* ── Helpers ── */
function getVal(id, fallback) {
  var el = document.getElementById(id);
  return el ? (el.value.trim() || fallback) : fallback;
}
function esc(str) {
  if (typeof str !== 'string') return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
