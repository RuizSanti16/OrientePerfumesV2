<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Productos Destacados — OrientPerfumes Admin</title>
<link rel="stylesheet" href="css/admin.css">
<style>
        .products-admin-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        margin-bottom: 24px;
        }
        .prod-card {
        background: var(--dark-surface);
        border: 1px solid rgba(201,168,76,0.15);
        border-radius: 8px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition: border-color 0.25s;
        }
        .prod-card:hover { border-color: rgba(201,168,76,0.35); }

        .prod-card__header {
        padding: 10px 14px;
        background: var(--dark-mid);
        border-bottom: 1px solid rgba(201,168,76,0.1);
        display: flex;
        align-items: center;
        justify-content: space-between;
        }
        .prod-card__num {
        font-family: var(--font-label);
        font-size: 9px;
        letter-spacing: 0.18em;
        color: var(--gold);
        text-transform: uppercase;
        }

        /* Imagen de previsualización 3:4 */
        .prod-preview {
        width: 100%;
        aspect-ratio: 3 / 4;
        background: linear-gradient(135deg, #1a1916, #111110);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
        border-bottom: 1px solid rgba(201,168,76,0.1);
        }
        .prod-preview img {
        width: 100%; height: 100%;
        object-fit: cover;
        display: block;
        position: absolute;
        inset: 0;
        }
        .prod-preview__placeholder {
        font-size: 48px;
        opacity: 0.12;
        user-select: none;
        }
        /* Badge sobre la imagen */
        .prod-preview__badge {
        position: absolute;
        top: 10px; left: 10px;
        font-family: var(--font-label);
        font-size: 8px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        padding: 4px 8px;
        z-index: 2;
        }
        .badge-new  { background: var(--gold); color: var(--dark); }
        .badge-excl { background: transparent; border: 1px solid var(--gold); color: var(--gold); }
        .badge-sale { background: #8B1C1C; color: #f5f0e8; }
        .badge-none { display: none !important; }

        /* Botón subir imagen */
        .btn-upload-img {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        width: 100%;
        padding: 7px;
        border: 1px dashed rgba(201,168,76,0.35);
        border-radius: 3px;
        background: none;
        color: var(--gold);
        font-family: var(--font-label);
        font-size: 8px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
        transition: background 0.2s, border-color 0.2s;
        }
        .btn-upload-img:hover {
        background: rgba(201,168,76,0.06);
        border-color: var(--gold);
        }
        .file-hidden { display: none; }

        /* Campos del producto */
        .prod-card__fields {
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        flex: 1;
        }

        /* Fila precio anterior — solo visible en oferta */
        .precio-anterior-row { display: none; }
        .precio-anterior-row.visible { display: block; }

        @media (max-width: 1100px) {
        .products-admin-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 580px) {
        .products-admin-grid { grid-template-columns: 1fr; }
        }
    </style>
    </head>
    <body>
    <div class="admin-layout">
    <aside class="admin-sidebar" id="adminSidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="admin-main">
        <header class="admin-header">
        <button class="sidebar-toggle" id="sidebarToggle">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="1.8" width="20" height="20">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
        </button>
        <div class="admin-header__right">
            <div class="admin-user-info">
            <span class="admin-user-info__name" id="adminUserName">Admin</span>
            <span class="admin-user-info__role" id="adminUserRole">(admin)</span>
            </div>
            <button class="btn-logout" onclick="adminLogout()">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
            </svg>
            Salir
            </button>
        </div>
        </header>

        <main class="admin-content">

        <div class="page-header">
            <h1 class="page-title">Productos Destacados</h1>
            <p class="page-subtitle">
            Configura los 4 productos que aparecen en la sección "Productos Destacados" del inicio.
            Edita nombre, marca, precio, badge e imagen de cada uno.
            </p>
        </div>

        <div class="products-admin-grid" id="productsGrid"></div>

        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;">
            <button class="btn btn-gold" onclick="guardarProductos()">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="2" width="14" height="14">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
            </svg>
            Guardar cambios
            </button>
            <button class="btn btn-ghost" onclick="restaurarDefecto()">
            Restaurar por defecto
            </button>
            <a href="../index.html#productos" target="_blank"
            class="btn btn-outline btn-sm"
            style="display:inline-flex;align-items:center;gap:6px;padding:10px 16px;">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="2" width="12" height="12">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
            </svg>
            Ver en el inicio
            </a>
        </div>

        </main>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="js/admin-data.js"></script>
<script src="js/admin-core.js"></script>
<script src="js/productos-destacados-admin.js"></script>
</body>
</html>
