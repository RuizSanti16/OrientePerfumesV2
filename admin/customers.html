<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes — OrientPerfumes Admin</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="admin-layout">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="admin-main">
    <header class="admin-header">
      <button class="sidebar-toggle" id="sidebarToggle">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" width="20" height="20"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="admin-header__right">
        <div class="admin-user-info">
          <span class="admin-user-info__name" id="adminUserName">Admin</span>
          <span class="admin-user-info__role" id="adminUserRole">(admin)</span>
        </div>
        <button class="btn-logout" onclick="adminLogout()">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          Salir
        </button>
      </div>
    </header>

    <main class="admin-content">
      <div class="page-header">
        <h1 class="page-title">Clientes</h1>
        <p class="page-subtitle">Directorio de clientes registrados</p>
      </div>

      <div class="page-toolbar">
        <div class="search-box">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><path stroke-linecap="round" d="m21 21-4.35-4.35"/></svg>
          <input type="text" id="searchInput" placeholder="Buscar clientes...">
        </div>
        <button class="btn btn-gold" onclick="openCustomerModal()">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
          Nuevo Cliente
        </button>
      </div>

      <div class="admin-card">
        <div class="admin-card__body table-wrapper">
          <table class="admin-table">
            <thead><tr><th>Nombre</th><th>Email</th><th>Teléfono</th><th>Dirección</th><th>Compras</th><th>Acciones</th></tr></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-header">
      <h3 class="modal-title" id="modalTitle">Nuevo Cliente</h3>
      <button class="modal-close" id="modalCloseBtn">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-gold" id="modalSaveBtn">Guardar</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="js/admin-data.js"></script>
<script src="js/admin-core.js"></script>
<script>
  var editingId = null;

  document.addEventListener('DOMContentLoaded', function () {
    initAdminLayout();
    renderTable();
    document.getElementById('searchInput').addEventListener('input', function () { renderTable(this.value); });
  });

  function renderTable(search) {
    search = (search || '').toLowerCase();
    var items = AdminDB.get('customers').filter(function (c) {
      return !search || c.name.toLowerCase().includes(search) || (c.email || '').toLowerCase().includes(search);
    });
    var tbody = document.getElementById('tableBody');
    if (items.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:28px;color:var(--cream-muted)">No se encontraron clientes</td></tr>';
      return;
    }
    tbody.innerHTML = items.map(function (c) {
      return '<tr>' +
        '<td><strong style="color:var(--cream);">' + c.name + '</strong></td>' +
        '<td>' + (c.email || '—') + '</td>' +
        '<td>' + (c.phone || '—') + '</td>' +
        '<td>' + (c.address || '—') + '</td>' +
        '<td><span class="badge badge-gold">' + (c.totalPurchases || 0) + '</span></td>' +
        '<td><div class="action-btns">' +
          '<button class="btn btn-outline btn-sm" onclick="openCustomerModal(\'' + c.id + '\')">' +
            '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="12" height="12"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>' +
          '</button>' +
        '</div></td></tr>';
    }).join('');
  }

  function openCustomerModal(id) {
    editingId = id || null;
    var c = id ? AdminDB.getOne('customers', id) : null;
    var body =
      '<div class="form-grid-2">' +
        '<div class="form-group"><label class="form-label">Nombre *</label><input class="form-input" id="fName" value="' + (c ? c.name : '') + '" placeholder="Nombre completo"></div>' +
        '<div class="form-group"><label class="form-label">Email *</label><input class="form-input" id="fEmail" type="email" value="' + (c ? c.email : '') + '" placeholder="email@ejemplo.com"></div>' +
      '</div>' +
      '<div class="form-grid-2">' +
        '<div class="form-group"><label class="form-label">Teléfono</label><input class="form-input" id="fPhone" value="' + (c ? (c.phone || '') : '') + '" placeholder="+34 600 000 000"></div>' +
        '<div class="form-group"><label class="form-label">Compras totales</label><input class="form-input" id="fPurchases" type="number" min="0" value="' + (c ? (c.totalPurchases || 0) : 0) + '"></div>' +
      '</div>' +
      '<div class="form-group"><label class="form-label">Dirección</label><input class="form-input" id="fAddress" value="' + (c ? (c.address || '') : '') + '" placeholder="Ciudad, País"></div>';
    openModal(id ? 'Editar Cliente' : 'Nuevo Cliente', body, saveCustomer);
  }

  function saveCustomer() {
    var name  = document.getElementById('fName').value.trim();
    var email = document.getElementById('fEmail').value.trim();
    if (!name || !email) { showToast('Nombre y email son requeridos', 'error'); return; }
    var data = {
      name: name, email: email,
      phone: document.getElementById('fPhone').value.trim(),
      address: document.getElementById('fAddress').value.trim(),
      totalPurchases: parseInt(document.getElementById('fPurchases').value) || 0,
    };
    if (editingId) { AdminDB.update('customers', editingId, data); showToast('Cliente actualizado', 'success'); }
    else { AdminDB.create('customers', data); showToast('Cliente creado', 'success'); }
    closeModal(); renderTable();
  }
</script>
</body>
</html>
