<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes — OrientPerfumes Admin</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="admin-layout">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="admin-main">
    <header class="admin-header">
      <button class="sidebar-toggle" id="sidebarToggle">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" width="20" height="20"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="admin-header__right">
        <div class="admin-user-info">
          <span class="admin-user-info__name" id="adminUserName">Admin</span>
          <span class="admin-user-info__role" id="adminUserRole">(admin)</span>
        </div>
        <button class="btn-logout" onclick="adminLogout()">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          Salir
        </button>
      </div>
    </header>
    <main class="admin-content">
      <div class="page-header">
        <h1 class="page-title">Clientes</h1>
        <p class="page-subtitle">Gestiona la base de clientes</p>
      </div>
      <div class="page-toolbar">
        <div class="search-box">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><path stroke-linecap="round" d="m21 21-4.35-4.35"/></svg>
          <input type="text" id="searchInput" placeholder="Buscar clientes...">
        </div>
        <button class="btn btn-gold" onclick="openModal()">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
          Nuevo Cliente
        </button>
      </div>
      <div class="admin-card">
        <div class="admin-card__body table-wrapper">
          <table class="admin-table">
            <thead><tr><th>ID</th><th>Nombre</th><th>Correo</th><th>Edad</th><th>Género</th><th>Acciones</th></tr></thead>
            <tbody id="tableBody"><tr><td colspan="6" style="text-align:center;padding:28px;color:var(--cream-muted)">Cargando...</td></tr></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-header">
      <h3 class="modal-title" id="modalTitle">Nuevo Cliente</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-gold" id="modalSaveBtn">Guardar</button>
    </div>
  </div>
</div>
<div class="toast-container" id="toastContainer"></div>

<script src="js/admin-data.js"></script>
<script src="js/admin-core.js"></script>
<script src="js/api.js"></script>
<script>
  var todos = [], editandoId = null;

  document.addEventListener('DOMContentLoaded', async function () {
    initAdminLayout();
    await cargar();
    document.getElementById('searchInput').addEventListener('input', function () { filtrar(this.value); });
    document.getElementById('modalSaveBtn').addEventListener('click', guardar);
  });

  async function cargar() {
    var res = await API.clientes.listar();
    if (!res.ok) { document.getElementById('tableBody').innerHTML = '<tr><td colspan="6" style="text-align:center;padding:28px;color:#e05252">Error al cargar</td></tr>'; return; }
    todos = res.data || [];
    render(todos);
  }

  function render(items) {
    var tbody = document.getElementById('tableBody');
    if (!items.length) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:28px;color:var(--cream-muted)">No hay clientes</td></tr>'; return; }
    tbody.innerHTML = items.map(function (c) {
      return '<tr><td class="mono">' + c.id_cliente + '</td><td><strong style="color:var(--cream)">' + esc(c.nombre) + '</strong></td>' +
        '<td>' + esc(c.correo || '—') + '</td><td>' + (c.edad || '—') + '</td><td>' + esc(c.genero || '—') + '</td>' +
        '<td><div class="action-btns">' +
          '<button class="btn btn-outline btn-sm" onclick="editar(' + c.id_cliente + ')"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="12" height="12"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg></button>' +
          '<button class="btn btn-danger btn-sm" onclick="eliminar(' + c.id_cliente + ')"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="12" height="12"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>' +
        '</div></td></tr>';
    }).join('');
  }

  function filtrar(s) {
    s = s.toLowerCase();
    render(todos.filter(function (c) { return !s || (c.nombre||'').toLowerCase().includes(s) || (c.correo||'').toLowerCase().includes(s); }));
  }

  function formHTML(c) {
    return '<div class="form-group"><label class="form-label">Nombre *</label><input class="form-input" id="fNombre" value="' + (c ? esc(c.nombre) : '') + '" placeholder="Nombre completo"></div>' +
      '<div class="form-group"><label class="form-label">Correo</label><input class="form-input" id="fCorreo" type="email" value="' + (c ? esc(c.correo||'') : '') + '" placeholder="correo@ejemplo.com"></div>' +
      '<div class="form-grid-2">' +
      '<div class="form-group"><label class="form-label">Edad</label><input class="form-input" id="fEdad" type="number" min="0" value="' + (c ? (c.edad||'') : '') + '" placeholder="0"></div>' +
      '<div class="form-group"><label class="form-label">Género</label><select class="form-select" id="fGenero"><option value="">Seleccionar</option><option value="M"' + (c&&c.genero==='M'?' selected':'') + '>Masculino</option><option value="F"' + (c&&c.genero==='F'?' selected':'') + '>Femenino</option><option value="Otro"' + (c&&c.genero==='Otro'?' selected':'') + '>Otro</option></select></div>' +
      '</div>';
  }

  function openModal() { editandoId = null; document.getElementById('modalTitle').textContent = 'Nuevo Cliente'; document.getElementById('modalBody').innerHTML = formHTML(null); document.getElementById('modalOverlay').classList.add('active'); }
  function editar(id) { editandoId = id; var c = todos.find(function(x){return x.id_cliente==id;}); document.getElementById('modalTitle').textContent = 'Editar Cliente'; document.getElementById('modalBody').innerHTML = formHTML(c); document.getElementById('modalOverlay').classList.add('active'); }
  function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }

  async function guardar() {
    var nombre = document.getElementById('fNombre').value.trim();
    if (!nombre) { showToast('El nombre es requerido', 'error'); return; }
    var data = { nombre: nombre, correo: document.getElementById('fCorreo').value.trim(), edad: parseInt(document.getElementById('fEdad').value)||null, genero: document.getElementById('fGenero').value };
    var res;
    if (editandoId) { data.id_cliente = editandoId; res = await API.clientes.actualizar(data); }
    else { res = await API.clientes.crear(data); }
    if (res.ok) { showToast(editandoId ? 'Cliente actualizado' : 'Cliente creado', 'success'); closeModal(); await cargar(); }
    else { showToast('Error: ' + (res.mensaje||'No se pudo guardar'), 'error'); }
  }

  async function eliminar(id) {
    confirmAction('¿Eliminar este cliente?', async function () {
      var res = await API.clientes.eliminar(id);
      if (res.ok) { showToast('Cliente eliminado', 'info'); await cargar(); }
      else { showToast('Error: ' + (res.mensaje||''), 'error'); }
    });
  }

  function esc(s) { return String(s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
