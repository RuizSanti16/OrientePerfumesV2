<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportes — OrientPerfumes Admin</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="admin-layout">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="admin-main">
    <header class="admin-header">
      <button class="sidebar-toggle" id="sidebarToggle">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" width="20" height="20"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="admin-header__right">
        <div class="admin-user-info">
          <span class="admin-user-info__name" id="adminUserName">Admin</span>
          <span class="admin-user-info__role" id="adminUserRole">(admin)</span>
        </div>
        <button class="btn-logout" onclick="adminLogout()">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          Salir
        </button>
      </div>
    </header>

    <main class="admin-content">
      <div class="page-header">
        <h1 class="page-title">Reportes</h1>
        <p class="page-subtitle">Análisis de ventas, inventario y rendimiento</p>
      </div>

      <!-- KPIs -->
      <div class="kpi-grid" id="kpiGrid"></div>

      <!-- Charts row 1 -->
      <div class="charts-grid">
        <div class="admin-card">
          <div class="admin-card__header"><span class="admin-card__title">Ingresos Mensuales</span></div>
          <div class="admin-card__padded"><div class="chart-container"><canvas id="revenueChart"></canvas></div></div>
        </div>
        <div class="admin-card">
          <div class="admin-card__header"><span class="admin-card__title">Ventas por Categoría</span></div>
          <div class="admin-card__padded"><div class="chart-container"><canvas id="categoryChart"></canvas></div></div>
        </div>
      </div>

      <!-- Charts row 2 -->
      <div class="charts-grid">
        <div class="admin-card">
          <div class="admin-card__header"><span class="admin-card__title">Stock por Producto</span></div>
          <div class="admin-card__padded"><div class="chart-container"><canvas id="stockChart"></canvas></div></div>
        </div>
        <div class="admin-card">
          <div class="admin-card__header"><span class="admin-card__title">Top Ventas</span></div>
          <div class="admin-card__body table-wrapper"><table class="admin-table" id="topTable">
            <thead><tr><th>#</th><th>Producto</th><th>Ventas</th><th>Ingresos</th></tr></thead>
            <tbody id="topBody"></tbody>
          </table></div>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="js/admin-data.js"></script>
<script src="js/admin-core.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    initAdminLayout();

    var products  = AdminDB.get('products');
    var sales     = AdminDB.get('sales');
    var orders    = AdminDB.get('orders');
    var customers = AdminDB.get('customers');

    var totalRevenue = sales.reduce(function (s, v) { return s + v.total; }, 0);
    var totalInventory = products.reduce(function (s, p) { return s + p.stock; }, 0);
    var avgOrder = orders.length ? Math.round(orders.reduce(function (s, o) { return s + o.total; }, 0) / orders.length) : 0;

    // KPIs
    var kpiData = [
      { label: 'Ingresos Totales',  value: '€' + totalRevenue.toLocaleString() },
      { label: 'Total Ventas',      value: sales.length },
      { label: 'Total Pedidos',     value: orders.length },
      { label: 'Ticket Promedio',   value: '€' + avgOrder },
    ];
    var grid = document.getElementById('kpiGrid');
    kpiData.forEach(function (k) {
      grid.innerHTML += '<div class="kpi-card"><div class="kpi-card__icon"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg></div><div><div class="kpi-card__label">' + k.label + '</div><div class="kpi-card__value">' + k.value + '</div></div></div>';
    });

    Chart.defaults.color = '#C8C0B0';
    Chart.defaults.borderColor = 'rgba(201,168,76,0.1)';

    // Revenue chart
    new Chart(document.getElementById('revenueChart'), {
      type: 'line',
      data: {
        labels: ['Oct', 'Nov', 'Dic', 'Ene', 'Feb', 'Mar'],
        datasets: [{
          label: 'Ingresos (€)',
          data: [8200, 9100, 14500, 11200, 10800, 12600],
          borderColor: '#C9A84C',
          backgroundColor: 'rgba(201,168,76,0.08)',
          borderWidth: 2,
          fill: true,
          tension: 0.4,
          pointBackgroundColor: '#C9A84C',
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { color: 'rgba(201,168,76,0.08)' }, ticks: { color: '#C8C0B0' } },
          y: { grid: { color: 'rgba(201,168,76,0.08)' }, ticks: { color: '#C8C0B0' } }
        }
      }
    });

    // Category doughnut
    new Chart(document.getElementById('categoryChart'), {
      type: 'doughnut',
      data: {
        labels: ['Eau de Parfum', 'Eau de Toilette', 'Cologne', 'Gift Sets'],
        datasets: [{ data: [45, 30, 15, 10], backgroundColor: ['#C9A84C','#8B6914','#E8C96A','#5C4A1E'], borderColor: '#1A1916', borderWidth: 2 }]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#C8C0B0', padding: 14 } } } }
    });

    // Stock bar chart
    new Chart(document.getElementById('stockChart'), {
      type: 'bar',
      data: {
        labels: products.map(function (p) { return p.name; }),
        datasets: [{
          label: 'Stock',
          data: products.map(function (p) { return p.stock; }),
          backgroundColor: products.map(function (p) { return p.stock < 20 ? 'rgba(224,82,82,0.6)' : 'rgba(201,168,76,0.6)'; }),
          borderColor: products.map(function (p) { return p.stock < 20 ? '#E05252' : '#C9A84C'; }),
          borderWidth: 1,
          borderRadius: 4,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { color: 'rgba(201,168,76,0.08)' }, ticks: { color: '#C8C0B0', font: { size: 10 } } },
          y: { grid: { color: 'rgba(201,168,76,0.08)' }, ticks: { color: '#C8C0B0' } }
        }
      }
    });

    // Top products
    var productRevenue = {};
    var productCount   = {};
    sales.forEach(function (s) {
      (s.items || []).forEach(function (item) {
        productRevenue[item.productName] = (productRevenue[item.productName] || 0) + (item.price * item.qty);
        productCount[item.productName]   = (productCount[item.productName] || 0) + item.qty;
      });
    });
    var topProds = Object.keys(productRevenue).sort(function (a, b) { return productRevenue[b] - productRevenue[a]; }).slice(0, 5);
    var topBody = document.getElementById('topBody');
    if (topProds.length === 0) {
      topBody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:28px;color:var(--cream-muted)">Sin datos de ventas</td></tr>';
    } else {
      topBody.innerHTML = topProds.map(function (name, i) {
        return '<tr><td><span class="badge badge-gold">' + (i + 1) + '</span></td><td><strong style="color:var(--cream);">' + name + '</strong></td><td>' + (productCount[name] || 0) + '</td><td class="bold">€' + (productRevenue[name] || 0).toFixed(2) + '</td></tr>';
      }).join('');
    }
  });
</script>
</body>
</html>
