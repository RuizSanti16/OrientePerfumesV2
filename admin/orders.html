<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos — OrientPerfumes Admin</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="admin-layout">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="admin-main">
    <header class="admin-header">
      <button class="sidebar-toggle" id="sidebarToggle">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" width="20" height="20"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="admin-header__right">
        <div class="admin-user-info">
          <span class="admin-user-info__name" id="adminUserName">Admin</span>
          <span class="admin-user-info__role" id="adminUserRole">(admin)</span>
        </div>
        <button class="btn-logout" onclick="adminLogout()">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          Salir
        </button>
      </div>
    </header>

    <main class="admin-content">
      <div class="page-header">
        <h1 class="page-title">Pedidos</h1>
        <p class="page-subtitle">Gestiona los pedidos de los clientes</p>
      </div>

      <!-- Filter buttons -->
      <div style="display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;">
        <button class="btn btn-gold btn-sm filter-btn active" data-filter="all">Todos</button>
        <button class="btn btn-outline btn-sm filter-btn" data-filter="pending">Pendientes</button>
        <button class="btn btn-outline btn-sm filter-btn" data-filter="processing">En Proceso</button>
        <button class="btn btn-outline btn-sm filter-btn" data-filter="shipped">Enviados</button>
        <button class="btn btn-outline btn-sm filter-btn" data-filter="delivered">Entregados</button>
        <button class="btn btn-outline btn-sm filter-btn" data-filter="cancelled">Cancelados</button>
      </div>

      <div class="admin-card">
        <div class="admin-card__body table-wrapper">
          <table class="admin-table">
            <thead><tr><th>Pedido</th><th>Fecha</th><th>Cliente</th><th>Email</th><th>Total</th><th>Estado</th><th>Cambiar Estado</th></tr></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="js/admin-data.js"></script>
<script src="js/admin-core.js"></script>
<script>
  var STATUS_LABELS = {
    pending: 'Pendiente', processing: 'En proceso',
    shipped: 'Enviado', delivered: 'Entregado', cancelled: 'Cancelado'
  };
  var STATUS_CLASS = {
    pending: 'badge-orange', processing: 'badge-blue',
    shipped: 'badge-gold', delivered: 'badge-green', cancelled: 'badge-red'
  };
  var currentFilter = 'all';

  document.addEventListener('DOMContentLoaded', function () {
    initAdminLayout();
    renderTable();

    document.querySelectorAll('.filter-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('.filter-btn').forEach(function (b) {
          b.classList.remove('active');
          b.classList.add('btn-outline');
          b.classList.remove('btn-gold');
        });
        this.classList.add('active', 'btn-gold');
        this.classList.remove('btn-outline');
        currentFilter = this.dataset.filter;
        renderTable();
      });
    });
  });

  function renderTable() {
    var items = AdminDB.get('orders').filter(function (o) {
      return currentFilter === 'all' || o.status === currentFilter;
    }).sort(function (a, b) { return b.date > a.date ? 1 : -1; });

    var tbody = document.getElementById('tableBody');
    if (items.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:28px;color:var(--cream-muted)">No hay pedidos</td></tr>';
      return;
    }

    var statusOptions = Object.keys(STATUS_LABELS).map(function (k) {
      return '<option value="' + k + '">' + STATUS_LABELS[k] + '</option>';
    }).join('');

    tbody.innerHTML = items.map(function (o) {
      return '<tr>' +
        '<td class="mono">' + o.id + '</td>' +
        '<td>' + o.date + '</td>' +
        '<td><strong style="color:var(--cream);">' + o.customerName + '</strong></td>' +
        '<td style="font-size:12px;">' + (o.customerEmail || '—') + '</td>' +
        '<td class="bold">$' + o.total + '</td>' +
        '<td><span class="badge ' + (STATUS_CLASS[o.status] || 'badge-gray') + '">' + (STATUS_LABELS[o.status] || o.status) + '</span></td>' +
        '<td>' +
          '<select class="form-select" style="width:130px;padding:5px 8px;font-size:11px;" onchange="updateOrderStatus(\'' + o.id + '\', this.value)">' +
            statusOptions.replace('value="' + o.status + '"', 'value="' + o.status + '" selected') +
          '</select>' +
        '</td></tr>';
    }).join('');
  }

  function updateOrderStatus(id, newStatus) {
    AdminDB.update('orders', id, { status: newStatus });
    showToast('Estado del pedido actualizado', 'success');
    renderTable();
  }
</script>
</body>
</html>
