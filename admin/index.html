<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — OrientPerfumes Admin</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="admin-layout">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="admin-main">
    <header class="admin-header">
      <button class="sidebar-toggle" id="sidebarToggle">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" width="20" height="20"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="admin-header__right">
        <div class="admin-user-info">
          <span class="admin-user-info__name" id="adminUserName">Admin</span>
          <span class="admin-user-info__role" id="adminUserRole">(admin)</span>
        </div>
        <button class="btn-logout" onclick="adminLogout()">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          Salir
        </button>
      </div>
    </header>

    <main class="admin-content">
      <div class="page-header">
        <h1 class="page-title">Dashboard</h1>
        <p class="page-subtitle">Resumen de actividad y métricas clave</p>
      </div>

      <!-- KPIs -->
      <div class="kpi-grid" id="kpiGrid"></div>

      <!-- Low stock alert -->
      <div id="lowStockAlert" style="display:none;" class="alert alert-warning">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
        <span id="lowStockText"></span>
      </div>

      <!-- Charts -->
      <div class="charts-grid">
        <div class="admin-card">
          <div class="admin-card__header"><span class="admin-card__title">Ingresos Mensuales</span></div>
          <div class="admin-card__padded"><div class="chart-container"><canvas id="revenueChart"></canvas></div></div>
        </div>
        <div class="admin-card">
          <div class="admin-card__header"><span class="admin-card__title">Ventas por Categoría</span></div>
          <div class="admin-card__padded"><div class="chart-container"><canvas id="categoryChart"></canvas></div></div>
        </div>
      </div>

      <!-- Recent Orders -->
      <div class="admin-card">
        <div class="admin-card__header">
          <span class="admin-card__title">Pedidos Recientes</span>
          <a href="orders.html" class="btn btn-outline btn-sm">Ver todos</a>
        </div>
        <div class="admin-card__body table-wrapper">
          <table class="admin-table" id="ordersTable">
            <thead><tr>
              <th>Pedido</th><th>Cliente</th><th>Fecha</th><th>Total</th><th>Estado</th>
            </tr></thead>
            <tbody id="ordersBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="js/admin-data.js"></script>
<script src="js/admin-core.js"></script>
<script>
  const STATUS_LABELS = {
    pending: 'Pendiente', processing: 'En proceso',
    shipped: 'Enviado', delivered: 'Entregado', cancelled: 'Cancelado'
  };
  const STATUS_CLASS = {
    pending: 'badge-orange', processing: 'badge-blue',
    shipped: 'badge-gold', delivered: 'badge-green', cancelled: 'badge-red'
  };

  document.addEventListener('DOMContentLoaded', function () {
    initAdminLayout();

    var products = AdminDB.get('products');
    var orders   = AdminDB.get('orders');
    var sales    = AdminDB.get('sales');

    var today = new Date().toISOString().split('T')[0];
    var todaySales = sales.filter(function (s) { return s.date === today; })
      .reduce(function (sum, s) { return sum + s.total; }, 0);

    var totalRevenue = sales.reduce(function (sum, s) { return sum + s.total; }, 0);
    var totalInventory = products.reduce(function (sum, p) { return sum + p.stock; }, 0);
    var pendingOrders = orders.filter(function (o) { return o.status === 'pending'; }).length;
    var lowStock = products.filter(function (p) { return p.stock < 20; });

    // KPI Cards
    var kpis = [
      { label: "Ventas Hoy",       value: '€' + todaySales,              icon: '<path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>' },
      { label: "Ingresos Totales", value: '€' + totalRevenue.toLocaleString(), icon: '<path stroke-linecap="round" stroke-linejoin="round" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>' },
      { label: "Inventario Total", value: totalInventory,               icon: '<path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>' },
      { label: "Pedidos Pend.",    value: pendingOrders,                icon: '<path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>' },
    ];

    var kpiGrid = document.getElementById('kpiGrid');
    kpis.forEach(function (kpi) {
      kpiGrid.innerHTML += '<div class="kpi-card"><div class="kpi-card__icon"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">' + kpi.icon + '</svg></div><div><div class="kpi-card__label">' + kpi.label + '</div><div class="kpi-card__value">' + kpi.value + '</div></div></div>';
    });

    // Low stock alert
    if (lowStock.length > 0) {
      var alertEl = document.getElementById('lowStockAlert');
      alertEl.style.display = 'flex';
      document.getElementById('lowStockText').textContent =
        lowStock.length + ' producto(s) con stock bajo (menos de 20 unidades): ' +
        lowStock.map(function (p) { return p.name + ' (' + p.stock + ')'; }).join(', ');
    }

    // Orders table
    var tbody = document.getElementById('ordersBody');
    if (orders.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--cream-muted)">No hay pedidos</td></tr>';
    } else {
      orders.slice(0, 5).forEach(function (o) {
        tbody.innerHTML +=
          '<tr><td class="mono">' + o.id + '</td>' +
          '<td>' + o.customerName + '</td>' +
          '<td>' + o.date + '</td>' +
          '<td class="bold">€' + o.total + '</td>' +
          '<td><span class="badge ' + (STATUS_CLASS[o.status] || 'badge-gray') + '">' + (STATUS_LABELS[o.status] || o.status) + '</span></td></tr>';
      });
    }

    // Charts
    var chartDefaults = {
      backgroundColor: 'transparent',
      color: '#C8C0B0',
    };
    Chart.defaults.color = '#C8C0B0';
    Chart.defaults.borderColor = 'rgba(201,168,76,0.1)';

    // Revenue bar chart
    new Chart(document.getElementById('revenueChart'), {
      type: 'bar',
      data: {
        labels: ['Oct', 'Nov', 'Dic', 'Ene', 'Feb', 'Mar'],
        datasets: [{
          label: 'Ingresos (€)',
          data: [8200, 9100, 14500, 11200, 10800, 12600],
          backgroundColor: 'rgba(201,168,76,0.7)',
          borderColor: '#C9A84C',
          borderWidth: 1,
          borderRadius: 4,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { color: 'rgba(201,168,76,0.08)' }, ticks: { color: '#C8C0B0' } },
          y: { grid: { color: 'rgba(201,168,76,0.08)' }, ticks: { color: '#C8C0B0' } }
        }
      }
    });

    // Category pie chart
    new Chart(document.getElementById('categoryChart'), {
      type: 'doughnut',
      data: {
        labels: ['Eau de Parfum', 'Eau de Toilette', 'Cologne', 'Gift Sets'],
        datasets: [{
          data: [45, 30, 15, 10],
          backgroundColor: ['#C9A84C', '#8B6914', '#E8C96A', '#5C4A1E'],
          borderColor: '#1A1916',
          borderWidth: 2,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { color: '#C8C0B0', padding: 16 } }
        }
      }
    });
  });
</script>
</body>
</html>
