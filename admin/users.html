<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuarios — OrientPerfumes Admin</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="admin-layout">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="admin-main">
    <header class="admin-header">
      <button class="sidebar-toggle" id="sidebarToggle">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" width="20" height="20"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="admin-header__right">
        <div class="admin-user-info">
          <span class="admin-user-info__name" id="adminUserName">Admin</span>
          <span class="admin-user-info__role" id="adminUserRole">(admin)</span>
        </div>
        <button class="btn-logout" onclick="adminLogout()">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          Salir
        </button>
      </div>
    </header>

    <main class="admin-content">
      <div class="page-header">
        <h1 class="page-title">Usuarios Admin</h1>
        <p class="page-subtitle">Gestiona el equipo de administración</p>
      </div>

      <div class="page-toolbar">
        <div></div>
        <button class="btn btn-gold" onclick="openUserModal()">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
          Nuevo Usuario
        </button>
      </div>

      <div class="admin-card">
        <div class="admin-card__body table-wrapper">
          <table class="admin-table">
            <thead><tr><th>Nombre</th><th>Email</th><th>Rol</th><th>Acciones</th></tr></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-header">
      <h3 class="modal-title" id="modalTitle">Nuevo Usuario</h3>
      <button class="modal-close" id="modalCloseBtn">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-gold" id="modalSaveBtn">Guardar</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="js/admin-data.js"></script>
<script src="js/admin-core.js"></script>
<script>
  var editingId = null;

  document.addEventListener('DOMContentLoaded', function () {
    initAdminLayout();
    renderTable();
  });

  function renderTable() {
    var items = AdminDB.get('adminUsers');
    var tbody = document.getElementById('tableBody');
    if (items.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:28px;color:var(--cream-muted)">No hay usuarios</td></tr>';
      return;
    }
    tbody.innerHTML = items.map(function (u) {
      var session = adminGetSession();
      var isMe = session && session.id === u.id;
      return '<tr>' +
        '<td><strong style="color:var(--cream);">' + u.name + (isMe ? ' <span class="badge badge-gold" style="font-size:8px;">Tú</span>' : '') + '</strong></td>' +
        '<td>' + u.email + '</td>' +
        '<td><span class="badge ' + (u.role === 'admin' ? 'badge-gold' : 'badge-blue') + '">' + u.role + '</span></td>' +
        '<td><div class="action-btns">' +
          '<button class="btn btn-outline btn-sm" onclick="openUserModal(\'' + u.id + '\')">' +
            '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="12" height="12"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>' +
          '</button>' +
          (!isMe ? '<button class="btn btn-danger btn-sm" onclick="deleteUser(\'' + u.id + '\')">' +
            '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="12" height="12"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>' +
          '</button>' : '') +
        '</div></td></tr>';
    }).join('');
  }

  function openUserModal(id) {
    editingId = id || null;
    var u = id ? AdminDB.getOne('adminUsers', id) : null;
    var body =
      '<div class="form-group"><label class="form-label">Nombre *</label>' +
        '<input class="form-input" id="fName" value="' + (u ? u.name : '') + '" placeholder="Nombre completo"></div>' +
      '<div class="form-group"><label class="form-label">Email *</label>' +
        '<input class="form-input" id="fEmail" type="email" value="' + (u ? u.email : '') + '" placeholder="admin@perfumeria.com"></div>' +
      '<div class="form-group"><label class="form-label">Contraseña ' + (id ? '(dejar en blanco para no cambiar)' : '*') + '</label>' +
        '<input class="form-input" id="fPass" type="password" placeholder="••••••••"></div>' +
      '<div class="form-group"><label class="form-label">Rol</label>' +
        '<select class="form-select" id="fRole">' +
          '<option value="admin"' + (u && u.role === 'admin' ? ' selected' : '') + '>Administrador</option>' +
          '<option value="manager"' + (u && u.role === 'manager' ? ' selected' : '') + '>Manager</option>' +
        '</select></div>';
    openModal(id ? 'Editar Usuario' : 'Nuevo Usuario', body, saveUser);
  }

  function saveUser() {
    var name  = document.getElementById('fName').value.trim();
    var email = document.getElementById('fEmail').value.trim();
    var pass  = document.getElementById('fPass').value;
    if (!name || !email) { showToast('Nombre y email son requeridos', 'error'); return; }
    if (!editingId && !pass) { showToast('La contraseña es requerida para nuevos usuarios', 'error'); return; }
    var data = { name: name, email: email, role: document.getElementById('fRole').value };
    if (pass) data.password = pass;
    if (editingId) { AdminDB.update('adminUsers', editingId, data); showToast('Usuario actualizado', 'success'); }
    else { AdminDB.create('adminUsers', data); showToast('Usuario creado', 'success'); }
    closeModal(); renderTable();
  }

  function deleteUser(id) {
    confirmAction('¿Eliminar este usuario?', function () {
      AdminDB.delete('adminUsers', id);
      showToast('Usuario eliminado', 'info');
      renderTable();
    });
  }
</script>
</body>
</html>
