<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos — OrientPerfumes Admin</title>
  <link rel="stylesheet" href="css/admin.css">
  <style>
    .img-preview { width:100%; height:140px; object-fit:cover; border-radius:6px; margin-top:8px; display:none; }
    .img-preview.visible { display:block; }
    .img-upload-area { border:2px dashed rgba(201,168,76,0.3); border-radius:8px; padding:20px; text-align:center; cursor:pointer; transition:border-color .2s; }
    .img-upload-area:hover { border-color:var(--gold); }
    .img-upload-area input[type=file] { display:none; }
    .presentaciones-list { display:flex; flex-direction:column; gap:8px; margin-top:8px; }
    .presentacion-row { display:grid; grid-template-columns:1fr 1fr auto; gap:8px; align-items:center; }
    .btn-remove-pres { background:none; border:none; color:#e05252; cursor:pointer; font-size:18px; padding:4px; }
    .btn-add-pres { background:rgba(201,168,76,0.1); border:1px solid rgba(201,168,76,0.3); color:var(--gold,#C9A84C); border-radius:6px; padding:8px 14px; cursor:pointer; font-size:11px; letter-spacing:0.1em; margin-top:8px; }
    .btn-add-pres:hover { background:rgba(201,168,76,0.2); }
    .section-label { font-size:11px; letter-spacing:0.12em; color:var(--gold,#C9A84C); text-transform:uppercase; margin:16px 0 8px; border-bottom:1px solid rgba(201,168,76,0.15); padding-bottom:6px; }
  </style>
</head>
<body>
<div class="admin-layout">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="admin-main">
    <header class="admin-header">
      <button class="sidebar-toggle" id="sidebarToggle">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" width="20" height="20"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="admin-header__right">
        <div class="admin-user-info">
          <span class="admin-user-info__name" id="adminUserName">Admin</span>
          <span class="admin-user-info__role" id="adminUserRole">(admin)</span>
        </div>
        <button class="btn-logout" onclick="adminLogout()">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          Salir
        </button>
      </div>
    </header>
    <main class="admin-content">
      <div class="page-header">
        <h1 class="page-title">Productos</h1>
        <p class="page-subtitle">Gestiona el catálogo de fragancias</p>
      </div>
      <div class="page-toolbar">
        <div class="search-box">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><path stroke-linecap="round" d="m21 21-4.35-4.35"/></svg>
          <input type="text" id="searchInput" placeholder="Buscar productos...">
        </div>
        <button class="btn btn-gold" onclick="openModal()">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
          Nuevo Producto
        </button>
      </div>
      <div class="admin-card">
        <div class="admin-card__body table-wrapper">
          <table class="admin-table">
            <thead><tr>
              <th>Img</th><th>ID</th><th>Nombre</th><th>Marca</th><th>Categoría</th><th>Precio base</th><th>Presentaciones</th><th>Acciones</th>
            </tr></thead>
            <tbody id="tableBody">
              <tr><td colspan="8" style="text-align:center;padding:28px;color:var(--cream-muted)">Cargando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box" style="max-width:620px;">
    <div class="modal-header">
      <h3 class="modal-title" id="modalTitle">Nuevo Producto</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-gold" id="modalSaveBtn">Guardar</button>
    </div>
  </div>
</div>
<div class="toast-container" id="toastContainer"></div>

<script src="js/admin-data.js"></script>
<script src="js/admin-core.js"></script>
<script src="js/api.js"></script>
<script>
  var todosProductos = [], todasMarcas = [], todasCategorias = [];
  var editandoId = null;
  var imagenBase64 = '';

  document.addEventListener('DOMContentLoaded', async function () {
    initAdminLayout();
    var [resProd, resMarcas, resCats] = await Promise.all([
      API.productos.listar(),
      API.marcas.listar(),
      API.categorias.listar()
    ]);
    todosProductos  = resProd.ok    ? (resProd.data    || []) : [];
    todasMarcas     = resMarcas.ok  ? (resMarcas.data  || []) : [];
    todasCategorias = resCats.ok    ? (resCats.data    || []) : [];
    renderTabla(todosProductos);
    document.getElementById('searchInput').addEventListener('input', function () { filtrarTabla(this.value); });
    document.getElementById('modalSaveBtn').addEventListener('click', guardarProducto);
  });

  /* ── Tabla ── */
  function renderTabla(items) {
    var tbody = document.getElementById('tableBody');
    if (!items || !items.length) {
      tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:28px;color:var(--cream-muted)">No hay productos registrados</td></tr>';
      return;
    }
    tbody.innerHTML = items.map(function(p) {
      var pres = [];
      try { pres = JSON.parse(p.presentaciones || '[]'); } catch(e) {}
      var presText = pres.length ? pres.map(function(x){ return esc(x.label); }).join(', ') : '—';
      var imgHTML = p.imagen
        ? '<img src="' + esc(p.imagen) + '" style="width:40px;height:40px;object-fit:cover;border-radius:4px;">'
        : '<span style="color:var(--cream-muted);font-size:18px;">🫙</span>';
      return '<tr>' +
        '<td>' + imgHTML + '</td>' +
        '<td class="mono">' + p.id_producto + '</td>' +
        '<td><strong style="color:var(--cream)">' + esc(p.nombre) + '</strong></td>' +
        '<td>' + esc(p.marca||'—') + '</td>' +
        '<td>' + esc(p.nombre_categoria||'—') + '</td>' +
        '<td class="bold">' + formatCOP(p.precio) + '</td>' +
        '<td style="color:var(--cream-muted);font-size:12px;">' + presText + '</td>' +
        '<td><div class="action-btns">' +
          '<button class="btn btn-outline btn-sm" onclick="abrirEditar(' + p.id_producto + ')">' +
            '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="12" height="12"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>' +
          '</button>' +
          '<button class="btn btn-danger btn-sm" onclick="eliminarProducto(' + p.id_producto + ')">' +
            '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="12" height="12"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>' +
          '</button>' +
        '</div></td>' +
      '</tr>';
    }).join('');
  }

  function filtrarTabla(s) {
    s = s.toLowerCase();
    renderTabla(todosProductos.filter(function(p) {
      return !s || (p.nombre||'').toLowerCase().includes(s) || (p.marca||'').toLowerCase().includes(s);
    }));
  }

  /* ── Opciones de select ── */
  function marcaOpts(sel) {
    return '<option value="">Sin marca</option>' +
      todasMarcas.map(function(m) {
        return '<option value="' + esc(m.nombre) + '"' + (sel===m.nombre?' selected':'') + '>' + esc(m.nombre) + '</option>';
      }).join('');
  }
  function catOpts(selId) {
    return '<option value="">Sin categoría</option>' +
      todasCategorias.map(function(c) {
        return '<option value="' + c.id_categoria + '"' + (selId==c.id_categoria?' selected':'') + '>' + esc(c.nombre) + '</option>';
      }).join('');
  }

  /* ── HTML del formulario ── */
  function formHTML(p) {
    var pres = [];
    try { pres = JSON.parse(p && p.presentaciones ? p.presentaciones : '[]'); } catch(e) {}

    var presRows = pres.map(function(pr, i) { return presRowHTML(pr.label, pr.precio); }).join('');

    return '<div class="section-label">Información básica</div>' +

      '<div class="form-group"><label class="form-label">Nombre *</label>' +
      '<input class="form-input" id="fNombre" value="' + (p?esc(p.nombre):'') + '" placeholder="Nombre del producto"></div>' +

      '<div class="form-grid-2">' +
        '<div class="form-group"><label class="form-label">Marca</label>' +
          '<select class="form-select" id="fMarca">' + marcaOpts(p?p.marca:'') + '</select></div>' +
        '<div class="form-group"><label class="form-label">Categoría</label>' +
          '<select class="form-select" id="fCategoria">' + catOpts(p?p.id_categoria:null) + '</select></div>' +
      '</div>' +

      '<div class="form-group"><label class="form-label">Precio base (COP) *</label>' +
      '<input class="form-input" id="fPrecio" type="number" min="0" value="' + (p?p.precio:'') + '" placeholder="Ej: 320000"></div>' +

      '<div class="form-group"><label class="form-label">Descripción</label>' +
      '<textarea class="form-textarea" id="fDesc" placeholder="Descripción del producto" rows="2">' + (p?esc(p.descripcion||''):'') + '</textarea></div>' +

      '<div class="section-label">Imagen del producto</div>' +
      '<div class="img-upload-area" onclick="document.getElementById(\'fImgFile\').click()">' +
        '<input type="file" id="fImgFile" accept="image/*">' +
        '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" width="28" height="28" style="color:var(--gold,#C9A84C);margin-bottom:6px;"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>' +
        '<p style="font-size:12px;color:var(--cream-muted);margin:0">Clic para subir imagen</p>' +
        '<p style="font-size:11px;color:var(--cream-muted);margin:4px 0 0">JPG, PNG — máx. 2MB</p>' +
      '</div>' +
      '<div class="form-group" style="margin-top:8px;">' +
        '<label class="form-label">O pega una URL de imagen</label>' +
        '<input class="form-input" id="fImgUrl" value="' + (p&&p.imagen&&!p.imagen.startsWith('data:')?esc(p.imagen):'') + '" placeholder="https://..."></div>' +
      (p&&p.imagen ? '<img id="imgPreview" src="' + esc(p.imagen) + '" class="img-preview visible">' : '<img id="imgPreview" class="img-preview">') +

      '<div class="section-label">Opciones de presentación</div>' +
      '<p style="font-size:12px;color:var(--cream-muted);margin:0 0 8px">Agrega las presentaciones disponibles con su precio individual.</p>' +
      '<div class="presentaciones-list" id="presList">' + presRows + '</div>' +
      '<button class="btn-add-pres" onclick="agregarPresentacion()">+ Agregar presentación</button>';
  }

  function presRowHTML(label, precio) {
    return '<div class="presentacion-row">' +
      '<input class="form-input pres-label" placeholder="Ej: 100ml, Decant 10ml" value="' + esc(label||'') + '">' +
      '<input class="form-input pres-precio" type="number" min="0" placeholder="Precio COP" value="' + (precio||'') + '">' +
      '<button class="btn-remove-pres" onclick="this.parentElement.remove()" title="Eliminar">✕</button>' +
    '</div>';
  }

  function agregarPresentacion() {
    var list = document.getElementById('presList');
    if (list) list.insertAdjacentHTML('beforeend', presRowHTML('', ''));
  }

  /* ── Manejar upload de imagen ── */
  function bindImageEvents() {
    imagenBase64 = '';
    var fileInput = document.getElementById('fImgFile');
    var urlInput  = document.getElementById('fImgUrl');
    var preview   = document.getElementById('imgPreview');

    if (fileInput) {
      fileInput.addEventListener('change', function() {
        var file = fileInput.files[0];
        if (!file) return;
        if (file.size > 2 * 1024 * 1024) { showToast('La imagen supera 2MB', 'error'); return; }
        var reader = new FileReader();
        reader.onload = function(e) {
          imagenBase64 = e.target.result;
          preview.src = imagenBase64;
          preview.classList.add('visible');
          urlInput.value = '';
        };
        reader.readAsDataURL(file);
      });
    }
    if (urlInput) {
      urlInput.addEventListener('input', function() {
        if (urlInput.value.trim()) {
          imagenBase64 = '';
          preview.src = urlInput.value.trim();
          preview.classList.add('visible');
        }
      });
    }
  }

  /* ── Modal ── */
  function openModal() {
    editandoId = null;
    imagenBase64 = '';
    document.getElementById('modalTitle').textContent = 'Nuevo Producto';
    document.getElementById('modalBody').innerHTML = formHTML(null);
    document.getElementById('modalOverlay').classList.add('active');
    bindImageEvents();
  }

  function abrirEditar(id) {
    editandoId = id;
    imagenBase64 = '';
    var p = todosProductos.find(function(x){return x.id_producto==id;});
    document.getElementById('modalTitle').textContent = 'Editar Producto';
    document.getElementById('modalBody').innerHTML = formHTML(p);
    document.getElementById('modalOverlay').classList.add('active');
    bindImageEvents();
    if (p && p.imagen && p.imagen.startsWith('data:')) {
      imagenBase64 = p.imagen;
    }
  }

  function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }

  /* ── Leer presentaciones del DOM ── */
  function leerPresentaciones() {
    var rows  = document.querySelectorAll('.presentacion-row');
    var pres  = [];
    rows.forEach(function(row) {
      var label  = row.querySelector('.pres-label')?.value.trim();
      var precio = parseFloat(row.querySelector('.pres-precio')?.value);
      if (label) pres.push({ label: label, precio: isNaN(precio) ? 0 : precio });
    });
    return pres;
  }

  /* ── Guardar ── */
  async function guardarProducto() {
    var nombre = document.getElementById('fNombre').value.trim();
    var precio = parseFloat(document.getElementById('fPrecio').value);
    if (!nombre)       { showToast('El nombre es requerido', 'error'); return; }
    if (isNaN(precio)) { showToast('El precio es requerido', 'error'); return; }

    var urlInput = document.getElementById('fImgUrl');
    var imagen   = imagenBase64 || (urlInput ? urlInput.value.trim() : '') ||
                   (editandoId ? (todosProductos.find(function(x){return x.id_producto==editandoId;})||{}).imagen : '') || '';

    var data = {
      nombre:          nombre,
      marca:           document.getElementById('fMarca').value,
      id_categoria:    parseInt(document.getElementById('fCategoria').value) || null,
      precio:          precio,
      descripcion:     document.getElementById('fDesc').value.trim(),
      imagen:          imagen,
      presentaciones:  JSON.stringify(leerPresentaciones())
    };

    var res;
    if (editandoId) { data.id_producto = editandoId; res = await API.productos.actualizar(data); }
    else            { res = await API.productos.crear(data); }

    if (res.ok) {
      showToast(editandoId ? 'Producto actualizado' : 'Producto creado', 'success');
      closeModal();
      var r = await API.productos.listar();
      todosProductos = r.ok ? (r.data||[]) : [];
      renderTabla(todosProductos);
    } else {
      showToast('Error: ' + (res.mensaje||'No se pudo guardar'), 'error');
    }
  }

  /* ── Eliminar ── */
  async function eliminarProducto(id) {
    confirmAction('¿Eliminar este producto?', async function() {
      var res = await API.productos.eliminar(id);
      if (res.ok) {
        showToast('Producto eliminado', 'info');
        var r = await API.productos.listar();
        todosProductos = r.ok ? (r.data||[]) : [];
        renderTabla(todosProductos);
      } else { showToast('Error: ' + (res.mensaje||''), 'error'); }
    });
  }

  function formatCOP(v) { return '$ ' + Number(v||0).toLocaleString('es-CO'); }
  function esc(s) { return String(s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
