<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compras — OrientPerfumes Admin</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="admin-layout">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="admin-main">
    <header class="admin-header">
      <button class="sidebar-toggle" id="sidebarToggle">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" width="20" height="20"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="admin-header__right">
        <div class="admin-user-info">
          <span class="admin-user-info__name" id="adminUserName">Admin</span>
          <span class="admin-user-info__role" id="adminUserRole">(admin)</span>
        </div>
        <button class="btn-logout" onclick="adminLogout()">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          Salir
        </button>
      </div>
    </header>

    <main class="admin-content">
      <div class="page-header">
        <h1 class="page-title">Compras</h1>
        <p class="page-subtitle">Órdenes de compra a proveedores</p>
      </div>

      <div class="page-toolbar">
        <div class="search-box">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><path stroke-linecap="round" d="m21 21-4.35-4.35"/></svg>
          <input type="text" id="searchInput" placeholder="Buscar por proveedor...">
        </div>
        <button class="btn btn-gold" onclick="openPurchaseModal()">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
          Nueva Compra
        </button>
      </div>

      <div class="admin-card">
        <div class="admin-card__body table-wrapper">
          <table class="admin-table">
            <thead><tr><th>#</th><th>Fecha</th><th>Proveedor</th><th>Producto</th><th>Cantidad</th><th>Total</th><th>Estado</th></tr></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-header">
      <h3 class="modal-title" id="modalTitle">Nueva Compra</h3>
      <button class="modal-close" id="modalCloseBtn">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-gold" id="modalSaveBtn">Guardar</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="js/admin-data.js"></script>
<script src="js/admin-core.js"></script>
<script>
  var STATUS_LABELS = { pending: 'Pendiente', received: 'Recibida', cancelled: 'Cancelada' };
  var STATUS_CLASS  = { pending: 'badge-orange', received: 'badge-green', cancelled: 'badge-red' };

  document.addEventListener('DOMContentLoaded', function () {
    initAdminLayout();
    renderTable();
    document.getElementById('searchInput').addEventListener('input', function () { renderTable(this.value); });
  });

  function renderTable(search) {
    search = (search || '').toLowerCase();
    var items = AdminDB.get('purchases').filter(function (p) {
      return !search || (p.supplierName || '').toLowerCase().includes(search);
    }).sort(function (a, b) { return b.date > a.date ? 1 : -1; });
    var tbody = document.getElementById('tableBody');
    if (items.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:28px;color:var(--cream-muted)">No hay compras registradas</td></tr>';
      return;
    }
    tbody.innerHTML = items.map(function (p) {
      var firstItem = p.items && p.items[0] ? p.items[0] : {};
      return '<tr>' +
        '<td class="mono">' + p.id + '</td>' +
        '<td>' + p.date + '</td>' +
        '<td><strong style="color:var(--cream);">' + (p.supplierName || '—') + '</strong></td>' +
        '<td>' + (firstItem.productName || '—') + '</td>' +
        '<td>' + (firstItem.qty || '—') + '</td>' +
        '<td class="bold">$' + p.total + '</td>' +
        '<td><span class="badge ' + (STATUS_CLASS[p.status] || 'badge-gray') + '">' + (STATUS_LABELS[p.status] || p.status) + '</span></td></tr>';
    }).join('');
  }

  function openPurchaseModal() {
    var suppliers = AdminDB.get('suppliers');
    var products  = AdminDB.get('products');
    var suppOpts  = suppliers.map(function (s) { return '<option value="' + s.id + '">' + s.name + '</option>'; }).join('');
    var prodOpts  = products.map(function (p) { return '<option value="' + p.id + '">' + p.name + '</option>'; }).join('');
    var body =
      '<div class="form-group"><label class="form-label">Proveedor *</label>' +
        '<select class="form-select" id="fSupplier"><option value="">Seleccionar</option>' + suppOpts + '</select></div>' +
      '<div class="form-group"><label class="form-label">Fecha</label>' +
        '<input class="form-input" id="fDate" type="date" value="' + new Date().toISOString().split('T')[0] + '"></div>' +
      '<div class="form-group"><label class="form-label">Producto *</label>' +
        '<select class="form-select" id="fProduct"><option value="">Seleccionar</option>' + prodOpts + '</select></div>' +
      '<div class="form-grid-2">' +
        '<div class="form-group"><label class="form-label">Cantidad *</label><input class="form-input" id="fQty" type="number" min="1" value="1"></div>' +
        '<div class="form-group"><label class="form-label">Coste unitario ($)</label><input class="form-input" id="fCost" type="number" min="0" value="0"></div>' +
      '</div>' +
      '<div class="form-group"><label class="form-label">Estado</label>' +
        '<select class="form-select" id="fStatus"><option value="pending">Pendiente</option><option value="received">Recibida</option></select></div>';
    openModal('Nueva Compra', body, savePurchase);
  }

  function savePurchase() {
    var suppId  = document.getElementById('fSupplier').value;
    var prodSel = document.getElementById('fProduct');
    var qty     = parseInt(document.getElementById('fQty').value) || 0;
    var cost    = parseFloat(document.getElementById('fCost').value) || 0;
    if (!suppId || !prodSel.value || qty < 1) { showToast('Completa los campos requeridos', 'error'); return; }
    var suppliers = AdminDB.get('suppliers');
    var supp = suppliers.find(function (s) { return s.id === suppId; });
    var data = {
      date: document.getElementById('fDate').value,
      supplierId: suppId,
      supplierName: supp ? supp.name : '',
      items: [{ productId: prodSel.value, productName: prodSel.options[prodSel.selectedIndex].text, qty: qty, unitCost: cost }],
      total: qty * cost,
      status: document.getElementById('fStatus').value,
    };
    AdminDB.create('purchases', data);
    // Update stock if received
    if (data.status === 'received') {
      var prod = AdminDB.getOne('products', prodSel.value);
      if (prod) AdminDB.update('products', prodSel.value, { stock: prod.stock + qty });
    }
    showToast('Compra registrada', 'success');
    closeModal(); renderTable();
  }
</script>
</body>
</html>
