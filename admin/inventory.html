<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario — OrientPerfumes Admin</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="admin-layout">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="admin-main">
    <header class="admin-header">
      <button class="sidebar-toggle" id="sidebarToggle">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" width="20" height="20"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="admin-header__right">
        <div class="admin-user-info">
          <span class="admin-user-info__name" id="adminUserName">Admin</span>
          <span class="admin-user-info__role" id="adminUserRole">(admin)</span>
        </div>
        <button class="btn-logout" onclick="adminLogout()">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          Salir
        </button>
      </div>
    </header>
    <main class="admin-content">
      <div class="page-header">
        <h1 class="page-title">Inventario</h1>
        <p class="page-subtitle">Control de stock por producto</p>
      </div>
      <div class="page-toolbar">
        <div class="search-box">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><path stroke-linecap="round" d="m21 21-4.35-4.35"/></svg>
          <input type="text" id="searchInput" placeholder="Buscar producto...">
        </div>
        <button class="btn btn-gold" onclick="openModal()">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
          Nuevo Registro
        </button>
      </div>
      <div class="admin-card">
        <div class="admin-card__body table-wrapper">
          <table class="admin-table">
            <thead><tr><th>ID</th><th>Producto</th><th>Marca</th><th>Stock</th><th>Ubicación</th><th>Acciones</th></tr></thead>
            <tbody id="tableBody"><tr><td colspan="6" style="text-align:center;padding:28px;color:var(--cream-muted)">Cargando...</td></tr></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-header">
      <h3 class="modal-title" id="modalTitle">Actualizar Stock</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-gold" id="modalSaveBtn">Guardar</button>
    </div>
  </div>
</div>
<div class="toast-container" id="toastContainer"></div>

<script src="js/admin-data.js"></script>
<script src="js/admin-core.js"></script>
<script src="js/api.js"></script>
<script>
  var todos = [], editandoId = null;

  document.addEventListener('DOMContentLoaded', async function () {
    initAdminLayout();
    await cargar();
    document.getElementById('searchInput').addEventListener('input', function () { filtrar(this.value); });
    document.getElementById('modalSaveBtn').addEventListener('click', guardar);
  });

  async function cargar() {
    var res = await API.inventario.listar();
    if (!res.ok) { document.getElementById('tableBody').innerHTML = '<tr><td colspan="6" style="text-align:center;padding:28px;color:#e05252">Error al cargar</td></tr>'; return; }
    todos = res.data || [];
    render(todos);
  }

  function render(items) {
    var tbody = document.getElementById('tableBody');
    if (!items.length) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:28px;color:var(--cream-muted)">No hay registros de inventario</td></tr>'; return; }
    tbody.innerHTML = items.map(function (i) {
      var stockClass = i.stock < 10 ? 'color:#e05252' : i.stock < 20 ? 'color:#ff9800' : 'color:#4caf50';
      return '<tr><td class="mono">' + i.id_inventario + '</td>' +
        '<td><strong style="color:var(--cream)">' + esc(i.nombre_producto||'—') + '</strong></td>' +
        '<td>' + esc(i.marca||'—') + '</td>' +
        '<td><strong style="' + stockClass + '">' + i.stock + '</strong></td>' +
        '<td>' + esc(i.ubicacion||'—') + '</td>' +
        '<td><div class="action-btns">' +
          '<button class="btn btn-outline btn-sm" onclick="editar(' + i.id_inventario + ')">Editar stock</button>' +
        '</div></td></tr>';
    }).join('');
  }

  function filtrar(s) {
    s = s.toLowerCase();
    render(todos.filter(function (i) { return !s || (i.nombre_producto||'').toLowerCase().includes(s) || (i.marca||'').toLowerCase().includes(s); }));
  }

  async function openModal() {
    editandoId = null;
    document.getElementById('modalTitle').textContent = 'Nuevo Registro de Inventario';

    /* Cargar productos para el selector */
    var resProd = await API.productos.listar();
    var productos = (resProd.ok && resProd.data) ? resProd.data : [];

    var opciones = productos.map(function(p) {
      return '<option value="' + p.id_producto + '">' + esc(p.nombre) + ' — ' + esc(p.marca||'Sin marca') + '</option>';
    }).join('');

    document.getElementById('modalBody').innerHTML =
      '<div class="form-group"><label class="form-label">Producto *</label>' +
      '<select class="form-select" id="fIdProducto">' +
      '<option value="">Seleccionar producto...</option>' + opciones +
      '</select></div>' +
      '<div class="form-group"><label class="form-label">Stock inicial *</label>' +
      '<input class="form-input" id="fStock" type="number" min="0" value="0" placeholder="0"></div>' +
      '<div class="form-group"><label class="form-label">Ubicación</label>' +
      '<input class="form-input" id="fUbicacion" placeholder="Ej: Bodega A, Estante 2"></div>';

    document.getElementById('modalOverlay').classList.add('active');
  }

  function editar(id) {
    editandoId = id;
    var item = todos.find(function(x){return x.id_inventario==id;});
    document.getElementById('modalTitle').textContent = 'Actualizar Stock — ' + (item ? esc(item.nombre_producto) : '');
    document.getElementById('modalBody').innerHTML =
      '<div class="form-group"><label class="form-label">Stock actual</label><input class="form-input" id="fStock" type="number" min="0" value="' + (item?item.stock:0) + '"></div>' +
      '<div class="form-group"><label class="form-label">Ubicación</label><input class="form-input" id="fUbicacion" value="' + (item?esc(item.ubicacion||''):'') + '" placeholder="Bodega A..."></div>';
    document.getElementById('modalOverlay').classList.add('active');
  }

  function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }

  async function guardar() {
    var res;
    if (editandoId) {
      var data = {
        id_inventario: editandoId,
        stock:     parseInt(document.getElementById('fStock').value) || 0,
        ubicacion: document.getElementById('fUbicacion').value.trim()
      };
      res = await API.inventario.actualizar(data);
    } else {
      var selectEl = document.getElementById('fIdProducto');
      var idProd   = parseInt(selectEl ? selectEl.value : 0);
      if (!idProd) { showToast('Selecciona un producto', 'error'); return; }

      var data = {
        id_producto: idProd,
        stock:       parseInt(document.getElementById('fStock').value) || 0,
        ubicacion:   document.getElementById('fUbicacion').value.trim()
      };
      res = await API.inventario.crear(data);
    }
    if (res.ok) {
      showToast(editandoId ? 'Stock actualizado' : 'Registro creado', 'success');
      closeModal();
      await cargar();
    } else {
      showToast('Error: ' + (res.mensaje || ''), 'error');
    }
  }

  function esc(s) { return String(s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
